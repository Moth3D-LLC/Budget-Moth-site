<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9f0e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Budget Moth</title>
<style>
:root{
  --ground:#e9f0e6; --sheet:#f7faf4; --ink:#18261d; --mute:#5b6c60; --rule:#b7cab8; --faint:#dbe7d8;
  --pen:#23469c; --pen-ink:#fff; --stamp:#bf3a2b; --ok:#2b7447; --wash:#e2ecdf;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --ground:#0e1711; --sheet:#152019; --ink:#e4efe5; --mute:#8ea295; --rule:#2d4234; --faint:#1d2c22;
    --pen:#8fabff; --pen-ink:#0b1430; --stamp:#ff8f7c; --ok:#7fd199; --wash:#1a2a20; color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --ground:#0e1711; --sheet:#152019; --ink:#e4efe5; --mute:#8ea295; --rule:#2d4234; --faint:#1d2c22;
  --pen:#8fabff; --pen-ink:#0b1430; --stamp:#ff8f7c; --ok:#7fd199; --wash:#1a2a20; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.45 var(--sans);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.neg{color:var(--stamp)} .pos{color:var(--ok)} .mute{color:var(--mute)}
.wrap{max-width:1040px;margin:0 auto;padding:14px 16px calc(92px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:6px 0 10px}
header.top h1{font:700 1.35rem/1.1 var(--serif);margin:0;letter-spacing:.01em}
header.top .sub{color:var(--mute);font-size:.85rem}

/* nav: bottom bar on phones, top tabs on wide screens */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--mute);min-height:54px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current=page]{color:var(--pen);font-weight:600}
@media (min-width:800px){
  nav.tabs{position:static;border:0;border-bottom:3px double var(--rule);background:none;padding:0;margin-bottom:18px}
  nav.tabs button{flex:0 0 auto;flex-direction:row;gap:8px;padding:10px 16px;font-size:.95rem;border-bottom:3px solid transparent;margin-bottom:-3px;min-height:0}
  nav.tabs button[aria-current=page]{border-bottom-color:var(--pen)}
  .wrap{padding-bottom:60px}
}

/* paper sections */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:14px 16px;margin:0 0 16px}
.sheet>h2,.sheet>.h{margin:0 0 8px;font:700 1.05rem/1.2 var(--serif);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h3{font:700 .98rem var(--serif);margin:0}
.note{color:var(--mute);font-size:.88rem;margin:4px 0 0}
.banner{background:var(--wash);border:1px solid var(--rule);border-left:4px solid var(--pen);padding:10px 12px;margin:0 0 14px;font-size:.92rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.warn{border-left-color:var(--stamp)}

/* buttons */
.btn{border:1px solid var(--pen);background:var(--pen);color:var(--pen-ink);padding:9px 16px;border-radius:3px;font-weight:600;min-height:42px}
.btn.alt{background:transparent;color:var(--pen)}
.btn.ghost{background:transparent;border-color:var(--rule);color:var(--ink);font-weight:500}
.btn.danger{background:transparent;border-color:var(--stamp);color:var(--stamp)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:.88rem}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}

/* forms */
label.f{display:block;font-size:.84rem;color:var(--mute);margin:0 0 4px}
input[type=text],input[type=number],input[type=date],input[type=search],select{width:100%;padding:10px 11px;border:1px solid var(--rule);background:var(--ground);border-radius:3px;min-height:44px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--pen)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2.keep{grid-template-columns:1fr 1fr}}
.amount{font:600 2.1rem/1.1 var(--serif);padding:10px 12px;text-align:right}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--pen);border-radius:3px;overflow:hidden;margin-bottom:14px}
.seg button{background:transparent;border:0;border-right:1px solid var(--pen);padding:10px 4px;color:var(--pen);font-weight:600;min-height:44px;font-size:.92rem}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--pen);color:var(--pen-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.chip{border:1px solid var(--rule);background:var(--ground);border-radius:99px;padding:6px 13px;font-size:.9rem;min-height:36px}
.chip[aria-pressed=true]{border-color:var(--pen);background:var(--pen);color:var(--pen-ink)}
.err{color:var(--stamp);font-size:.9rem;min-height:1.3em;margin:6px 0 0}

/* ledger-style tables */
table.l{width:100%;border-collapse:collapse;font-size:.95rem}
table.l th{font:600 .8rem var(--sans);color:var(--mute);text-align:right;padding:6px 6px;border-bottom:3px double var(--rule);white-space:nowrap}
table.l th:first-child,table.l td:first-child{text-align:left}
table.l td{padding:9px 6px;border-bottom:1px solid var(--faint);text-align:right;vertical-align:middle}
table.l tr.grp td{font:700 .92rem var(--serif);background:var(--wash);text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule)}
table.l tr.sub td{font-weight:700;border-top:1px solid var(--rule);border-bottom:3px double var(--rule)}
table.l td.name{max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;background:var(--faint);margin-top:5px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--pen)}
.bar.over i{background:var(--stamp)}
button.lnk{background:none;border:0;padding:2px 0;border-bottom:1px dotted var(--mute);color:inherit}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pen);margin-left:4px;vertical-align:middle}

/* footing: income - spent - saved = left */
.footing{display:flex;flex-wrap:wrap;gap:6px 0;align-items:flex-end;margin:0 0 6px}
.footing .t{flex:1 1 130px;min-width:120px;padding-right:8px}
.footing .t span{display:block;font-size:.8rem;color:var(--mute)}
.footing .t b{font:600 1.45rem/1.15 var(--serif);font-variant-numeric:tabular-nums}
.footing .op{align-self:flex-end;padding:0 8px 2px 0;font:400 1.4rem var(--serif);color:var(--mute)}
.footing .t.res{border-top:3px double var(--ink);padding-top:4px;flex-basis:150px}
.footing .t.res b{font-size:1.7rem}
@media (max-width:560px){.footing .op{display:none}.footing .t{flex-basis:45%}}

.monthnav{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.monthnav h2{flex:1;margin:0;text-align:center;font:700 1.25rem var(--serif)}
.monthnav button{min-width:44px}

/* entries */
.entries{list-style:none;margin:0;padding:0}
.entry{display:grid;grid-template-columns:48px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--faint);padding:9px 2px;min-height:52px}
.entry .d{font-size:.82rem;color:var(--mute);line-height:1.1}
.entry .m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .m small{display:block;color:var(--mute);font-size:.8rem}
.dayh{font:700 .85rem var(--serif);padding:10px 2px 3px;color:var(--mute);border-bottom:1px solid var(--rule)}

/* year grid */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.y{border-collapse:collapse;font-size:.85rem;min-width:900px;width:100%}
table.y th,table.y td{padding:6px 7px;border-bottom:1px solid var(--faint);text-align:right;white-space:nowrap}
table.y th{border-bottom:3px double var(--rule);font-weight:600;color:var(--mute)}
table.y td:first-child,table.y th:first-child{text-align:left;position:sticky;left:0;background:var(--sheet);z-index:1;max-width:150px;overflow:hidden;text-overflow:ellipsis}
table.y tr.grp td{background:var(--wash);font:700 .85rem var(--serif)}
table.y tr.sub td{font-weight:700;border-top:1px solid var(--rule)}
table.y td.over{color:var(--stamp);font-weight:700}
table.y td.zero{color:var(--rule)}

/* settings */
.cat{display:grid;grid-template-columns:1fr 92px;gap:8px;padding:10px 0;border-bottom:1px solid var(--faint)}
.cat .sub2{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cat .sub2 select{width:auto;min-width:130px;min-height:38px;padding:6px 8px}
.cat .sub2 input[type=number]{width:110px;min-height:38px;padding:6px 8px}
.cat .sub2 label{display:flex;gap:6px;align-items:center;font-size:.88rem;color:var(--mute)}
details.sheet>summary{font:700 1.05rem var(--serif);cursor:pointer;list-style:revert}
details.sheet[open]>summary{margin-bottom:10px}

dialog{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:4px;padding:18px;width:min(520px,calc(100vw - 24px));max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(10,20,14,.55)}
dialog h2{margin:0 0 12px;font:700 1.15rem var(--serif)}
dialog .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
@media (min-width:800px){#toast{bottom:24px}}
.toast{pointer-events:auto;background:var(--ink);color:var(--ground);padding:10px 14px;border-radius:3px;display:flex;gap:14px;align-items:center;font-size:.92rem;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:600;padding:0}
.legend{display:flex;gap:8px 14px;flex-wrap:wrap;font-size:.84rem;margin-top:8px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:3px;display:inline-block}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--mute);font:11px var(--sans)}
svg.chart [data-t]{cursor:pointer}
svg.chart text{pointer-events:none}
.chart-read{font-size:.86rem;color:var(--mute);min-height:1.4em;margin:6px 0 0}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:10px}
.donutwrap svg.chart{width:176px;flex:none}
.brk{list-style:none;margin:0;padding:0;flex:1;min-width:230px}
.brk li{display:grid;grid-template-columns:12px 1fr auto;gap:4px 8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--faint);font-size:.92rem}
.brk li i{width:10px;height:10px;display:inline-block;align-self:center}
.brk small{grid-column:2/4;color:var(--mute);font-size:.78rem}
.clip{width:13px;height:13px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round;vertical-align:-2px;margin-left:6px}
.rcthumb{padding:0;border:1px solid var(--rule);background:var(--faint);width:84px;height:84px;flex:none;overflow:hidden}
.rcthumb img{width:100%;height:100%;object-fit:cover;display:block}
.rcfull{max-width:100%;max-height:62vh;display:block;margin:0 auto;border:1px solid var(--rule)}
.chip.tr{border-left-width:5px}
.empty{padding:18px 4px;color:var(--mute);text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}}}
.syncbtn{background:none;border:1px solid var(--rule);border-radius:99px;padding:3px 11px;font-size:.8rem;color:var(--mute);min-height:30px;white-space:nowrap}
.syncbtn.warn{border-color:var(--stamp);color:var(--stamp);font-weight:600}
.cat .sub2 input[type=month]{width:150px;min-height:38px;padding:6px 8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<dialog id="dlg"></dialog>
<div id="toast" aria-live="polite"></div>

<script>
'use strict';
/* ============================================================
   Budget Moth — single file, no dependencies, works offline.
   Data lives in this browser (localStorage). Export for backups.
   ============================================================ */
const KEY='budgetledger.v1';
const APPV='11 (generic defaults)';
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const M3=MONTHS.map(m=>m.slice(0,3));
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const mk=d=>d.slice(0,7);
const addMonths=(k,n)=>{let [y,m]=k.split('-').map(Number);m+=n-1;y+=Math.floor(m/12);m=((m%12)+12)%12;return `${y}-${pad(m+1)}`};
const monthLabel=k=>`${MONTHS[+k.slice(5)-1]} ${k.slice(0,4)}`;
const dayLabel=d=>`${M3[+d.slice(5,7)-1]} ${+d.slice(8,10)}`;
let storageOK=true;
function fmt(n,opts={}){
  n=r2(n); if(Object.is(n,-0))n=0;
  try{return new Intl.NumberFormat(undefined,{style:'currency',currency:state.settings.currency||'USD',...opts}).format(n)}
  catch(e){return (n<0?'-':'')+'$'+Math.abs(n).toFixed(2)}
}
function parseAmt(s){
  s=String(s).replace(/[$,\s]/g,''); if(!s)return NaN;
  if(/^[-+]?\d*\.?\d+$/.test(s))return +s;
  if(/^[\d.+\-*/()]+$/.test(s)){try{const v=Function('"use strict";return ('+s+')')();return isFinite(v)?v:NaN}catch(e){return NaN}}
  return NaN;
}

/* ---------------- default data, taken from the spreadsheet template ---------------- */
function defaults(){
  const G=[
    ['housing','Housing','expense'],['food','Food','expense'],['transport','Transportation','expense'],
    ['lifestyle','Lifestyle','expense'],['debt','Other','expense'],['giving','Giving','expense'],
    ['instax','Insurance & Taxes','bucket'],['saved','Savings Goals','bucket']];
  const E=[ // id,name,group,budget,fixed  (ids stay the same as the original template so spreadsheet imports keep working)
    ['mortgage','Rent / Mortgage','housing',1200,1],['tracfone','Cellular','housing',40,1],['internet','Internet','housing',70,1],
    ['water','Water/Electric','housing',200,0],['gas','Natural Gas','housing',80,0],['garbage','Garbage','housing',25,1],
    ['otherhouse','Household Items','housing',100,0],
    ['groceries','Groceries','food',400,0],['restaurants','Restaurants','food',100,0],['snacks','Snacks','food',50,0],
    ['gasoil','Gas & Oil','transport',150,0],
    ['clothing','Clothing','lifestyle',75,0],['hygiene','Hygiene','lifestyle',25,0],['spotify','Subscriptions','lifestyle',15,1],
    ['entertainment','Entertainment','lifestyle',100,0],['misc','Misc','lifestyle',50,0],
    ['unplanned','Unplanned','debt',0,0],['hangout','Fun Money','debt',50,0],
    ['tithing','Donations','giving',100,0]];
  const B=[ // id,name,group,monthly target,account
    ['propertytax','Property Tax','instax',200,'Savings'],['houseins','Home Insurance','instax',100,'Savings'],
    ['carins','Car Insurance','instax',100,'Savings'],
    ['efund','Emergency Fund','saved',100,'Savings'],['computer','Tech Fund','saved',50,'Checking'],
    ['gun','Hobby Fund','saved',50,'Checking'],['carrepl','Car Replacement','saved',100,'Savings'],
    ['3dp','Project Fund','saved',50,'Checking'],['tradira','Traditional IRA','saved',0,'Retirement'],
    ['rothira','Roth IRA','saved',100,'Retirement'],['tip','Vacation','saved',50,'Savings'],
    ['homeimp','Home Improvement','saved',100,'Checking']];
  return {v:1,
    settings:{currency:'USD',expectedIncome:0,leftoverStart:0,leftoverAccount:'Checking',actual:{}},
    accounts:['Checking','Savings','Retirement'],
    groups:G.map(([id,name,kind])=>({id,name,kind})),
    cats:[...E.map(([id,name,group,budget,fixed])=>({id,name,kind:'expense',group,budget,fixed:!!fixed,ov:{}})),
          ...B.map(([id,name,group,budget,account])=>({id,name,kind:'bucket',group,budget,account,start:0,ov:{}}))],
    tx:[],meta:{changes:0,lastBackup:null}};
}
let state=load();
let SNAP=snapOf(state);
if(!state.meta.firstUse){state.meta.firstUse=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
/* change tracking: every entry remembers when it last changed, and deletions leave a marker, so devices can merge */
function h32(str){let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return (h>>>0).toString(36)}
function partHashes(s){return {cfg:h32(JSON.stringify([s.settings,s.accounts,s.groups,s.cats])),rules:h32(JSON.stringify(s.rules||[])),learn:h32(JSON.stringify(s.learn||{}))}}
function txSig(t){return [t.date,t.type,t.cat||'',t.amt,t.memo||'',t.splits?JSON.stringify(t.splits):''].join('|')}
function snapOf(s){const m=new Map();for(const t of s.tx)m.set(t.id,txSig(t));return m}
function trackTx(now){
  const d=state.deleted||(state.deleted={}),cur=new Map();
  for(const t of state.tx){const g=txSig(t);cur.set(t.id,g);if(SNAP.get(t.id)!==g)t.u=now}
  for(const id of SNAP.keys())if(!cur.has(id))d[id]=now;
  SNAP=cur;
}
function trackParts(now){
  const h=partHashes(state),m=state.meta,ph=m.partHash||{};m.partAt=m.partAt||{};
  for(const k in h)if(ph[k]!==h[k])m.partAt[k]=now;
  m.partHash=h;
}
function replaceState(ns){ns=fixState(ns);ns.meta.partHash={};state=ns;cache=null}
function load(){
  try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.cats&&o.tx){for(const c of o.cats){if(c.id==='tracfone'&&c.name==='Tracfone')c.name='Cellular';if(c.id==='spotify'&&c.name==='Spotify')c.name='Subscription'}return fixState(o)}}}catch(e){storageOK=false}
  return fixState(defaults());
}
function fixState(o){for(const c of (o.cats||[]))if(c.id==='tip'&&c.name==='Tip to Israel')c.name='Vacation';o.rules=o.rules||[];o.learn=o.learn||{};o.deleted=o.deleted||{};o.meta=o.meta||{changes:0,lastBackup:null};o.settings=o.settings||{};o.settings.actual=o.settings.actual||{};o.meta.partAt=o.meta.partAt||{};if(!o.meta.partHash)o.meta.partHash=partHashes(o);return o}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOK=false}}
let cache=null;
function commit(){const m=state.meta,now=Date.now();m.changes=(m.changes||0)+1;const hc=histDiff();trackTx(now);trackParts(now);m.updatedAt=now;cache=null;persist();syncSchedule();if(hc&&!histSup)histRecord(hc)}

/* ---------------- undo history ----------------
   Each step remembers only what it changed (entries and settings parts), so undoing never
   reverses edits that arrived from another device. The list is kept on this device. */
const PK=KEY+'.prefs';
let PREFS={backupDays:7,snooze:0};
try{Object.assign(PREFS,JSON.parse(localStorage.getItem(PK)||'{}'))}catch(e){}
const savePrefs=()=>{try{localStorage.setItem(PK,JSON.stringify(PREFS))}catch(e){}};
let PREVJ=new Map(),PREVP={},HIST={u:[],r:[]},histSup=false,histTimer=null;
const partStr=s=>({cfg:JSON.stringify({settings:s.settings,accounts:s.accounts,groups:s.groups,cats:s.cats}),rules:JSON.stringify(s.rules||[]),learn:JSON.stringify(s.learn||{})});
function prevReset(){PREVJ=new Map();for(const t of state.tx)PREVJ.set(t.id,JSON.stringify(t));PREVP=partStr(state)}
prevReset();
function histDiff(){
  const tx=[],cur=new Set();
  for(const t of state.tx){cur.add(t.id);if(txSig(t)!==SNAP.get(t.id)){const a=JSON.stringify(t);tx.push([t.id,PREVJ.get(t.id)||null,a]);PREVJ.set(t.id,a)}}
  for(const id of [...PREVJ.keys()])if(!cur.has(id)){tx.push([id,PREVJ.get(id),null]);PREVJ.delete(id)}
  const np=partStr(state),parts={};let pc=false;
  for(const k in np)if(np[k]!==PREVP[k]){parts[k]=[PREVP[k],np[k]];pc=true}

/* Income a percent-based budget is measured against: what came in that month, or your expected income if nothing has yet */
const incomeBasis=k=>{const inc=(agg()[k]||{}).income||0;return inc>0?inc:(state.settings.expectedIncome||0)};
const budgetOf=(c,k)=>{
  if(c.ov&&k in c.ov)return c.ov[k];
  if(c.pct>0)return r2(incomeBasis(k)*c.pct/100);
  return c.budget;
};
/* Rollover: what a category carries into month k from the months since it was switched on */
function carryIn(c,k){
  if(c.kind!=='expense'||!c.roll||!c.rollFrom||k<=c.rollFrom)return 0;
  let carry=0,m=c.rollFrom,g=0;
  while(m<k&&g++<240){
    const left=(budgetOf(c,m)||0)+carry-(((agg()[m]||{}).cat||{})[c.id]||0);
    carry=c.roll==='surplus'?Math.max(0,left):left;
    m=addMonths(m,1);
  }
  return r2(carry);
}
const monthShort=k=>M3[+k.slice(5,7)-1]+' '+k.slice(0,4);
/* Savings goal progress for a bucket */
function goalInfo(c,k,bal){
  if(!(c.goal>0))return null;
  const rem=r2(c.goal-bal),target=budgetOf(c,k)||0;
  if(rem<=0)return {done:true,pct:100,rem:0,target};
  const g={done:false,pct:Math.max(0,Math.min(100,bal/c.goal*100)),rem,target};
  if(target>0){g.n=Math.ceil(rem/target-1e-9);g.proj=addMonths(k,g.n)}
  if(c.goalBy){
    const [gy,gm]=c.goalBy.slice(0,7).split('-').map(Number),[ky,km]=k.split('-').map(Number);
    g.diff=(gy*12+gm)-(ky*12+km);
    if(g.diff>0){g.need=Math.ceil(rem/g.diff*100-1e-9)/100;g.onTrack=target*g.diff>=rem-0.004}

const catName=id=>{const c=cat(id);return c?c.name:'(deleted)'};
function agg(){
  if(cache)return cache;
  const out={};
  for(const t of state.tx){
    const k=mk(t.date);const m=out[k]||(out[k]={income:0,spent:0,saved:0,bsp:0,cat:{},sv:{},bs:{}});
    if(t.type==='income')m.income+=t.amt;
    else if(t.type==='expense'){m.spent+=t.amt;if(t.splits)for(const p of t.splits)m.cat[p.cat]=(m.cat[p.cat]||0)+p.amt;else m.cat[t.cat]=(m.cat[t.cat]||0)+t.amt}
    else if(t.type==='save'){m.saved+=t.amt;m.sv[t.cat]=(m.sv[t.cat]||0)+t.amt}
    else if(t.type==='bspend'){m.bsp+=t.amt;m.bs[t.cat]=(m.bs[t.cat]||0)+t.amt}
  }

}

/* Left over for the month = income - spent - saved (same footing as the template's "Total") */
const netOf=m=>r2(m.income-m.spent-m.saved);
/* running balances through the end of month k */
function cumTo(k){
  const bal={};for(const c of state.cats)if(c.kind==='bucket')bal[c.id]=c.start||0;
  let left=state.settings.leftoverStart||0;
  for(const t of state.tx){
    if(mk(t.date)>k)continue;
    if(t.type==='income')left+=t.amt;
    else if(t.type==='expense')left-=t.amt;
    else if(t.type==='save'){left-=t.amt;bal[t.cat]=(bal[t.cat]||0)+t.amt}
    else if(t.type==='bspend')bal[t.cat]=(bal[t.cat]||0)-t.amt;
  }
  for(const id in bal)bal[id]=r2(bal[id]);

}

  for(const c of state.cats){if(c.archived)continue;const v=budgetOf(c,k)||0;if(c.kind==='expense')e+=v;else b+=v}
  return {exp:r2(e),sav:r2(b),total:r2(e+b)};
}

const PAL=['#23469c','#c2582b','#2b7447','#a8497a','#8a7a1c','#6d5bb0','#1f8a96','#b5483a','#5b6c60','#3b7d3b','#c28a1d','#4a6fa5'];

/* Spending breakdown for a month: donut plus a ranked list, with the change from the month before */
function donut(items,tot,spent){

    s+=`<circle cx="${C}" cy="${C}" r="${rad}" fill="none" stroke="${it.color}" stroke-width="${R-r}" stroke-dasharray="${len} ${circ}" stroke-dashoffset="${-off}" transform="rotate(-90 ${C} ${C})" data-t="${esc(it.name+': '+fmt(it.v)+' ('+Math.round(f*100)+'%)')}"><title>${esc(it.name)}: ${fmt(it.v)}</title></circle>`;
    off+=f*circ;

  return `<svg class="chart" viewBox="0 0 180 180" role="img" aria-label="Spending by ${items.length} slices">${s}<text x="${C}" y="${C}" text-anchor="middle" style="font-size:15px;font-weight:600;fill:var(--ink)">${fmt(spent,{minimumFractionDigits:0,maximumFractionDigits:0})}</text><text x="${C}" y="${C+16}" text-anchor="middle">spent</text></svg>`;
}
function breakdown(k,m){

  const gname=id=>{const c=cat(id),g=c&&group(c.group);return g?g.name:'(deleted)'};
  const key=by==='grp'?gname:id=>id,nm=by==='grp'?x=>x:catName;
  const cur={},prev={};

  const rows=Object.entries(cur).map(([id,v])=>({id,v:r2(v)})).filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
  if(!rows.length)return '';

  if(rest.length)items.push({name:`Other (${rest.length})`,v:r2(rest.reduce((a,r)=>a+r.v,0)),p:r2(rest.reduce((a,r)=>a+(prev[r.id]||0),0)),color:'#8c9a90'});
  const pl=M3[+addMonths(k,-1).slice(5)-1];

  return `<section class="sheet"><h2>Where it went</h2>
    <div class="seg" role="group" aria-label="Group spending by"><button type="button" data-act="brk" data-v="cat" aria-pressed="${by==='cat'}">By category</button><button type="button" data-act="brk" data-v="grp" aria-pressed="${by==='grp'}">By group</button></div>
    <div class="donutwrap">${donut(items,tot,m.spent)}<ul class="brk">${items.map(it=>`<li><i style="background:${it.color}"></i><span>${esc(it.name)}</span><b class="num">${fmt(it.v)} <span class="mute" style="font-weight:400">· ${Math.round(it.v/tot*100)}%</span></b><small>${dl(it)}</small></li>`).join('')}</ul></div>
    <p class="chart-read" aria-live="polite">Tap a slice for its share.</p></section>`;
}
function lineChart(labels,series,aria){
  const W=640,H=230,L=52,R=12,T=12,B=26;
  const all=series.flatMap(s=>s.vals).filter(v=>v!=null);let mn=Math.min(0,...all),mx=Math.max(1,...all);
  const span=mx-mn||1;const step=niceStep(span/4);mn=Math.floor(mn/step)*step;mx=Math.ceil(mx/step)*step;
  const x=i=>L+(W-L-R)*i/(labels.length-1||1),y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn||1));
  let g='';for(let v=mn;v<=mx+1e-9;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--faint)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${compact(v)}</text>`;

  const lines=series.map(s=>{

      +(s.dash?'':s.vals.map((v,i)=>{if(v==null)return '';const t=`${s.name} · ${labels[i]}: ${fmt(v)}`;return `<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="${s.color}"><title>${esc(t)}</title></circle><circle cx="${x(i)}" cy="${y(v)}" r="13" fill="transparent" data-t="${esc(t)}"/>`}).join(''));
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria||'Savings balance by month')}">${g}${lines}</svg><p class="chart-read" aria-live="polite">Tap or hover a point for its value.</p>`;
}
function niceStep(s){const p=Math.pow(10,Math.floor(Math.log10(s||1)));const n=s/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
const compact=v=>Math.abs(v)>=1000?(v/1000).toFixed(v%1000?1:0)+'k':String(Math.round(v));

    body+=`<tr class="grp"><td colspan="15">${esc(g.name)} (saved)</td></tr>`;
    for(const c of cs){const vals=ks.map(k=>r2(MS(k).sv[c.id]||0));saveRows.push(vals);
      const bt=r2(ks.reduce((a,k)=>a+(c.archived?0:budgetOf(c,k)||0),0));
      body+=`<tr><td>${esc(c.name)}</td>${vals.map(v=>cell(v)).join('')}${cell(total(vals))}${cell(bt)}</tr>`}
  }
  const saved=ks.map((k,i)=>r2(saveRows.reduce((a,r)=>a+r[i],0)));
  body+=`<tr class="sub"><td>Total saved</td>${saved.map(v=>cell(v)).join('')}${cell(total(saved))}<td></td></tr>`;
  const net=ks.map((k,i)=>r2(inc[i]-spent[i]-saved[i]));
  body+=`<tr class="sub"><td>Left over</td>${net.map(v=>`<td class="num ${v<0?'over':''}">${v===0?'–':fmt(v,{minimumFractionDigits:0,maximumFractionDigits:0})}</td>`).join('')}${cell(total(net))}<td></td></tr>`;
  const mx=Math.max(1,...inc,...spent.map((v,i)=>v+saved[i]));
  const W=640,H=190,L=10,R=10,T=10,B=24,bw=(W-L-R)/12;
  let bars='';ks.forEach((k,i)=>{const x0=L+i*bw,h1=(H-T-B)*inc[i]/mx,out=spent[i]+saved[i],h2=(H-T-B)*out/mx;
    bars+=`<rect x="${x0+bw*.12}" width="${bw*.34}" y="${H-B-h1}" height="${h1}" fill="var(--ok)" data-t="${M3[i]}: income ${fmt(inc[i])}"><title>${M3[i]} income ${fmt(inc[i])}</title></rect><rect x="${x0+bw*.5}" width="${bw*.34}" y="${H-B-h2}" height="${h2}" fill="var(--pen)" data-t="${M3[i]}: spent ${fmt(spent[i])} + saved ${fmt(saved[i])}"><title>${M3[i]} spent + saved ${fmt(out)}</title></rect><text x="${x0+bw/2}" y="${H-8}" text-anchor="middle">${M3[i]}</text>`});
  return `<div class="monthnav"><button class="btn ghost" data-act="ynav" data-n="-1" aria-label="Previous year">‹</button><h2>${y}</h2><button class="btn ghost" data-act="ynav" data-n="1" aria-label="Next year">›</button></div>
  <section class="sheet"><h2>Income against spending and saving</h2><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly income compared with spent plus saved">${bars}<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--rule)"/></svg>
  <div class="legend"><span><i style="background:var(--ok)"></i>Income</span><span><i style="background:var(--pen)"></i>Spent + saved</span></div><p class="chart-read" aria-live="polite">Tap a bar for its amount.</p></section>
  ${trendSection(ks)}
  <section class="sheet"><div class="scroll"><table class="y"><thead>${head}</thead><tbody>${body}</tbody></table></div>
  <p class="note">Red cells went over that month's budget. Budget column adds up the year's monthly budgets.</p></section>`;
}

const dlg=$('#dlg');let dh={};
function openDlg(html,handlers={}){dlg.innerHTML=html;dh=handlers;if(!dlg.open)dlg.showModal()}
function closeDlg(){if(dlg.open)dlg.close()}
dlg.addEventListener('click',e=>{if(e.target===dlg){closeDlg();return}const b=e.target.closest('[data-d]');if(b&&dh[b.dataset.d]){e.preventDefault();dh[b.dataset.d](b,e)}});
dlg.addEventListener('submit',e=>{e.preventDefault();if(dh.submit)dh.submit(new FormData(e.target),e.target)});
dlg.addEventListener('change',e=>{if(dh.change)dh.change(e.target)});

function toast(msg,undo,label){
  $('#toast').innerHTML='';const t=document.createElement('div');t.className='toast';t.innerHTML=`<span>${esc(msg)}</span>`;
  if(undo){const b=document.createElement('button');b.textContent=label||'Undo';b.onclick=()=>{undo();t.remove()};t.appendChild(b)}
  $('#toast').appendChild(t);setTimeout(()=>t.remove(),undo?6500:3200);
}

/* ---------------- actions ---------------- */
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T12:00'))}
function checkTx(d){
  const amt=parseAmt(d.amt);
  if(isNaN(amt)||amt===0)return 'Enter an amount, like 12.50.';
  if(d.type==='income'&&amt<0)return 'Income must be a positive amount.';
  if((d.type==='bspend')&&amt<0)return 'Enter a positive amount.';
  if(d.type==='expense'&&d.splits&&d.splits.length>1){
    const sum=r2(d.splits.reduce((a,p)=>a+p.amt,0));
    if(Math.abs(sum-amt)>0.004)return `Your split adds up to ${fmt(sum)}, but the amount is ${fmt(amt)}. Edit the split or the amount.`;
  }else if(kindOfType(d.type)&&!d.cat)return d.type==='expense'?'Choose a category.':'Choose a savings bucket.';
  if(!validDate(d.date))return 'Enter a valid date.';
  return '';
}
function addTx(d){
  const t={id:uid(),date:d.date,type:d.type,cat:kindOfType(d.type)?d.cat:null,amt:r2(parseAmt(d.amt)),memo:(d.memo||'').trim()};
  if(d.type==='expense'&&d.splits&&d.splits.length>1){t.cat=null;t.splits=d.splits.map(p=>({cat:p.cat,amt:r2(p.amt)}))}
  state.tx.push(t);commit();return t;
}
function removeTx(id){const i=state.tx.findIndex(t=>t.id===id);if(i<0)return null;const [t]=state.tx.splice(i,1);commit();return t}
function submitAdd(){
  const d=ui.draft;ui.err=checkTx(d);
  if(ui.err){render();return}
  const t=addTx(d);
  if(t.type==='expense'&&t.memo)learnCat(t.memo,t.cat);
  if(ui.rcDraft){const b=ui.rcDraft;ui.rcDraft=null;rcPut(t.id,b).then(()=>render()).catch(()=>toast('Entry saved, but the receipt could not be stored.'))}
  ui.draft.amt='';ui.draft.memo='';ui.err='';ui.autoCat=false;ui.draft.splits=null;
  const mkey=mk(t.date);if(ui.tab==='add'&&mkey!==ui.month)ui.month=mkey;
  render();const a=$('#d-amt');if(a)a.focus({preventScroll:true});
  toast(`Added ${fmt(t.amt)} · ${t.splits?'Split':t.cat?catName(t.cat):(t.memo||'Income')}`,()=>{removeTx(t.id);render()});
}
function openEdit(id,dr){
  const t=state.tx.find(x=>x.id===id);if(!t)return;
  const D=dr||{type:t.type,amt:t.amt,cat:t.cat||'',date:t.date,memo:t.memo||'',splits:t.splits||null};
  const catw=(type,sel)=>{
    const k=kindOfType(type);if(!k)return '';
    if(type==='expense'&&D.splits)return `<p class="note" style="margin:12px 0 6px">Split across ${D.splits.length} categories: ${D.splits.map(p=>`${esc(catName(p.cat))} ${fmt(p.amt)}`).join(', ')}</p><button type="button" class="btn sm alt" data-d="split">Edit split</button>`;
    return `<label class="f" for="e-cat" style="margin-top:12px">Category</label><select id="e-cat" name="cat">${catOptions(k,sel)}</select>${type==='expense'?`<button type="button" class="btn sm ghost" style="margin-top:8px" data-d="split">Split across categories…</button>`:''}`;
  };
  openDlg(`<h2>Edit entry</h2><form id="ef">
    <label class="f" for="e-type">Type</label><select id="e-type" name="type" data-ef="type">${Object.entries(TYPE_LABEL).map(([v,l])=>`<option value="${v}" ${v===D.type?'selected':''}>${l}</option>`).join('')}</select>
    <label class="f" for="e-amt" style="margin-top:12px">Amount</label><input id="e-amt" name="amt" type="text" inputmode="decimal" value="${esc(D.amt)}">
    <div id="e-catw">${catw(D.type,D.cat)}</div>
    <div class="grid2" style="margin-top:12px"><div><label class="f" for="e-date">Date</label><input id="e-date" name="date" type="date" value="${esc(D.date)}"></div><div><label class="f" for="e-memo">Note</label><input id="e-memo" name="memo" type="text" value="${esc(D.memo)}"></div></div>
    <div id="e-rc" style="margin-top:12px">${rcBlock(id)}</div><input id="e-rcf" type="file" accept="image/*" hidden data-rc="edit">
    <p class="err" id="e-err" role="alert"></p>
    <div class="actions"><button type="button" class="btn danger" data-d="del" style="margin-right:auto">Delete</button><button type="button" class="btn ghost" data-d="cancel">Cancel</button><button class="btn" type="submit">Save changes</button></div></form>`,{
    cancel:closeDlg,
    del(){const gone=removeTx(id);closeDlg();render();toast('Entry deleted',()=>{state.tx.push(gone);commit();render()})},
    rcview(){openReceipt(id,()=>openEdit(id,D))},
    rcdel(){rcDel(id).then(()=>{$('#e-rc').innerHTML=rcBlock(id);render()}).catch(()=>{})},
    change(el){
      if(el.dataset.ef==='type'){D.type=el.value;if(D.type!=='expense')D.splits=null;$('#e-catw').innerHTML=catw(D.type,'')}
      else if(el.dataset.rc==='edit'){const f=el.files[0];el.value='';if(f)attachReceipt(id,f).then(()=>{const w=$('#e-rc');if(w){w.innerHTML=rcBlock(id);hydrateRc(dlg)}render()})}
    },
    split(){
      const amt=parseAmt($('#e-amt').value);
      if(isNaN(amt)||amt<=0){$('#e-err').textContent='Enter a positive amount first, then split it.';return}
      D.amt=$('#e-amt').value;D.date=$('#e-date').value;D.memo=$('#e-memo').value;D.cat=($('#e-cat')||{}).value||D.cat||'';
      openSplit(amt,D.splits||(D.cat?[{cat:D.cat,amt}]:null),(parts,single)=>{D.splits=parts;D.cat=parts?'':(single||D.cat);openEdit(id,D)},()=>openEdit(id,D));
    },
    submit(fd){
      const d={type:fd.get('type'),amt:fd.get('amt'),cat:fd.get('cat')||'',date:fd.get('date'),memo:fd.get('memo')||'',splits:null};
      if(d.type==='expense'&&D.splits)d.splits=D.splits;
      const e=checkTx(d);if(e){$('#e-err').textContent=e;return}
      Object.assign(t,{type:d.type,amt:r2(parseAmt(d.amt)),cat:kindOfType(d.type)?d.cat:null,date:d.date,memo:d.memo.trim()});
      if(d.splits&&d.splits.length>1){t.cat=null;t.splits=d.splits.map(p=>({cat:p.cat,amt:r2(p.amt)}))}else delete t.splits;
      if(d.type==='expense'&&d.memo.trim()&&t.cat)learnCat(d.memo,d.cat);
      commit();closeDlg();render();toast('Entry updated');
    }});
  hydrateRc(dlg);
}
/* ----- receipts: photos stay on this device (IndexedDB), never in the synced data ----- */
const RC=new Map();
const rcStore=async(mode,fn)=>{const db=await idbOpen();return new Promise((res,rej)=>{const tr=db.transaction('receipts',mode);let out;const q=fn(tr.objectStore('receipts'));if(q)q.onsuccess=()=>{out=q.result};tr.oncomplete=()=>res(out);tr.onerror=tr.onabort=()=>rej(tr.error)})};
async function rcPut(id,blob){const buf=await blob.arrayBuffer();await rcStore('readwrite',s=>s.put({type:blob.type||'image/jpeg',buf,at:Date.now()},id));RC.set(id,buf.byteLength);try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
async function rcGet(id){const v=await rcStore('readonly',s=>s.get(id));return v?new Blob([v.buf],{type:v.type}):null}
async function rcDel(id){await rcStore('readwrite',s=>s.delete(id));RC.delete(id)}
async function rcLoad(){
  try{const db=await idbOpen();await new Promise(res=>{const q=db.transaction('receipts').objectStore('receipts').openCursor();q.onsuccess=()=>{const c=q.result;if(c){RC.set(c.key,(c.value.buf&&c.value.buf.byteLength)||0);c.continue()}else res()};q.onerror=()=>res()})}catch(e){}
}
/* photos whose entry is gone (and can no longer be undone) are cleaned up when the app opens */
async function rcPurge(){
  const keep=new Set(state.tx.map(t=>t.id));
  for(const e of HIST.u.concat(HIST.r))for(const x of e.tx)keep.add(x[0]);
  for(const id of [...RC.keys()])if(!keep.has(id))await rcDel(id).catch(()=>{});
}
async function shrinkPhoto(file){
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}
  catch(e){bmp=await new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('That file could not be read as a picture.'))};im.src=u})}
  const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,sc=Math.min(1,1400/Math.max(w,h));
  const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*sc));cv.height=Math.max(1,Math.round(h*sc));
  const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(bmp,0,0,cv.width,cv.height);
  return new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('Could not process the picture.')),'image/jpeg',.72));
}
async function attachReceipt(id,file){
  try{await rcPut(id,await shrinkPhoto(file));toast('Receipt saved on this device')}
  catch(e){toast(e&&e.message?e.message:'Could not save the receipt.')}
}
function rcBlock(id){
  return RC.has(id)
    ?`<label class="f">Receipt</label><div class="row" style="flex-wrap:nowrap"><button type="button" class="rcthumb" data-d="rcview" aria-label="View receipt"><img data-rcimg="${id}" alt="Receipt photo"></button><div class="row"><label class="btn sm alt" for="e-rcf" style="display:inline-flex;align-items:center">Replace</label><button type="button" class="btn sm danger" data-d="rcdel">Remove</button></div></div>`
    :`<label class="btn sm alt" for="e-rcf" style="display:inline-flex;align-items:center">Attach receipt photo</label>`;
}
const RCURLS=[];
async function hydrateRc(root){
  for(const im of root.querySelectorAll('img[data-rcimg]')){
    try{const b=await rcGet(im.dataset.rcimg);if(b){const u=URL.createObjectURL(b);RCURLS.push(u);im.src=u}}catch(e){}

  let rows=(parts&&parts.length>1?parts:[{cat:(parts&&parts[0]&&parts[0].cat)||'',amt:total},{cat:'',amt:''}]).map(p=>({cat:p.cat||'',amt:p.amt}));
  const left=()=>r2(total-rows.reduce((a,r)=>a+(parseAmt(r.amt)||0),0));
  const sync=()=>{rows=rows.map((r,i)=>({cat:($(`[name=c${i}]`,dlg)||{}).value??r.cat,amt:($(`[name=a${i}]`,dlg)||{}).value??r.amt}))};
  const upd=()=>{const l=left(),el=$('#sp-left',dlg);if(el)el.innerHTML=l===0?'<b class="pos">Fully assigned.</b>':l>0?`<b class="num">${fmt(l)}</b> still to assign`:`<b class="neg num">${fmt(-l)} over</b>`};
  const draw=()=>{
    dlg.innerHTML=`<h2>Split across categories</h2><p class="note" style="margin-top:0">Total <b class="num">${fmt(total)}</b>. Divide it between categories.</p><form>
      ${rows.map((r,i)=>`<div class="row" style="flex-wrap:nowrap;margin:8px 0"><select name="c${i}" class="grow" aria-label="Category ${i+1}">${catOptions('expense',r.cat)}</select><input name="a${i}" type="text" inputmode="decimal" style="width:104px;text-align:right" value="${esc(r.amt)}" aria-label="Amount ${i+1}"><button type="button" class="btn sm ghost" data-d="rm" data-i="${i}" aria-label="Remove row ${i+1}">×</button></div>`).join('')}
      <button type="button" class="btn sm alt" data-d="add">Add another category</button>
      <p class="note" id="sp-left"></p><p class="err" id="sp-err" role="alert"></p>
      <div class="actions">${parts&&parts.length>1?`<button type="button" class="btn ghost" data-d="clear" style="margin-right:auto">Remove split</button>`:''}<button type="button" class="btn ghost" data-d="cancel">Cancel</button><button class="btn" type="submit">Save split</button></div></form>`;
    upd();
  };
  openDlg('',{
    cancel(){onCancel?onCancel():closeDlg()},
    add(){sync();const l=left();rows.push({cat:'',amt:l>0?l:''});draw()},
    rm(b){sync();rows.splice(+b.dataset.i,1);while(rows.length<2)rows.push({cat:'',amt:''});draw()},

        if(!r.cat){$('#sp-err').textContent='Choose a category for every row.';return}
        const e=out.find(x=>x.cat===r.cat);if(e)e.amt=r2(e.amt+a);else out.push({cat:r.cat,amt:r2(a)})}
      const sum=r2(out.reduce((a,p)=>a+p.amt,0));

      if(Math.abs(sum-total)>0.004){$('#sp-err').textContent=`The rows add up to ${fmt(sum)}, but the total is ${fmt(total)}.`;return}
      closeDlg();out.length>1?cb(out):cb(null,out[0].cat);
    }});
  draw();
}

  const B=v=>({v,s:1}),$m=v=>({v:r2(v),s:2});

  const R=()=>sum.length+1;
  const rowTotal=(r)=>({v:0,f:`SUM(C${r}:N${r})`,s:3});
  const fillTotals=(r,vals)=>{sum[r-1][14]={v:r2(vals.reduce((a,b)=>a+b,0)),f:`SUM(C${r}:N${r})`,s:3}};
  const incR=R();const incV=ks.map(k=>MS(k).income);
  sum.push([B('Income'),'',...incV.map($m),{v:r2(incV.reduce((a,b)=>a+b,0)),f:`SUM(C${incR}:N${incR})`,s:3}]);
  const expRows=[],savRows=[];
  for(const g of state.groups.filter(g=>g.kind==='expense'))for(const c of state.cats.filter(c=>c.group===g.id)){
    const v=ks.map(k=>MS(k).cat[c.id]||0);if(c.archived&&!v.some(Boolean))continue;
    const r=R();expRows.push(r);
    sum.push([c.name,g.name,...v.map($m),{v:r2(v.reduce((a,b)=>a+b,0)),f:`SUM(C${r}:N${r})`,s:3},$m(ks.reduce((a,k)=>a+(c.archived?0:budgetOf(c,k)||0),0))]);
  }
  const spV=ks.map(k=>MS(k).spent),spR=R();
  const colF=(rows,col)=>rows.length?rows.map(r=>`${col}${r}`).join('+'):'0';
  const L=['C','D','E','F','G','H','I','J','K','L','M','N','O'];
  sum.push([B('Total spent'),'',...spV.map((v,i)=>({v:r2(v),f:colF(expRows,L[i]),s:3})),{v:r2(spV.reduce((a,b)=>a+b,0)),f:colF(expRows,'O'),s:3}]);
  for(const g of state.groups.filter(g=>g.kind==='bucket'))for(const c of state.cats.filter(c=>c.group===g.id)){
    const v=ks.map(k=>MS(k).sv[c.id]||0);if(c.archived&&!v.some(Boolean))continue;
    const r=R();savRows.push(r);
    sum.push([c.name+' (saved)',g.name,...v.map($m),{v:r2(v.reduce((a,b)=>a+b,0)),f:`SUM(C${r}:N${r})`,s:3},$m(ks.reduce((a,k)=>a+(c.archived?0:budgetOf(c,k)||0),0))]);
  }
  const svV=ks.map(k=>MS(k).saved),svR=R();
  sum.push([B('Total saved'),'',...svV.map((v,i)=>({v:r2(v),f:colF(savRows,L[i]),s:3})),{v:r2(svV.reduce((a,b)=>a+b,0)),f:colF(savRows,'O'),s:3}]);
  const netV=ks.map((k,i)=>incV[i]-spV[i]-svV[i]);
  sum.push([B('Left over (income − spent − saved)'),'',...netV.map((v,i)=>({v:r2(v),f:`${L[i]}${incR}-${L[i]}${spR}-${L[i]}${svR}`,s:3})),{v:r2(netV.reduce((a,b)=>a+b,0)),f:`O${incR}-O${spR}-O${svR}`,s:3}]);
  /* Savings balances */
  const bal=[[B(`Savings balances at month end, ${y}`)],[B('Bucket'),B('Held in'),...M3.map(B)]];
  const cums=ks.map(k=>cumTo(k));
  for(const c of state.cats.filter(c=>c.kind==='bucket'&&!c.archived))bal.push([c.name,c.account||'',...cums.map(x=>$m(x.bal[c.id]||0))]);
  bal.push([B('Unallocated cash'),state.settings.leftoverAccount,...cums.map(x=>$m(x.left))]);
  const txs=[[B('Date'),B('Type'),B('Category'),B('Group'),B('Amount'),B('Memo')],...txRows().map(r=>[r[0],r[1],r[2],r[3],{v:r[4],s:2},r[5]])];
  const cats=[[B('Name'),B('Kind'),B('Group'),B('Monthly budget'),B('Fixed bill'),B('Account'),B('Starting balance'),B('Archived'),B('Percent of income'),B('Rollover'),B('Rollover from'),B('Goal'),B('Goal by')],
    ...state.cats.map(c=>[c.name,c.kind,(group(c.group)||{}).name||'',{v:c.budget,s:2},c.fixed?'yes':'',c.account||'',{v:c.start||0,s:2},c.archived?'yes':'',c.pct||'',c.roll||'',c.rollFrom||'',c.goal?{v:c.goal,s:2}:'',c.goalBy||''])];
  const st=state.settings;
  const setr=[[B('Setting'),B('Value')],['currency',st.currency],['expectedIncome',st.expectedIncome||0],['leftoverStart',st.leftoverStart||0],['leftoverAccount',st.leftoverAccount],['accounts',state.accounts.join('|')]];
  const recr=[[B('Type'),B('Category'),B('Amount'),B('Note'),B('Frequency'),B('Next date'),B('Second day'),B('Automatic'),B('Active')],...state.rules.map(r=>[r.type,r.cat?catName(r.cat):'',{v:r.amt,s:2},r.memo||'',r.freq,r.next,r.day2,r.auto?'yes':'',r.active?'yes':''])];
  const comr=[[B('Bank text'),B('Show as'),B('Category'),B('Always skip')],...Object.keys(state.learn).map(k=>{const p=merProf(state.learn[k]);return [k,p.name||'',p.cat?catName(p.cat):'',p.skip?'yes':'']})];
  download(`budget-moth-${y}.xlsx`,makeXLSX([
    {name:'Month Summary',rows:sum,widths:[34,18,...Array(12).fill(11),12,14]},
    {name:'Savings Balances',rows:bal,widths:[28,16,...Array(12).fill(11)]},
    {name:'Transactions',rows:txs,widths:[12,12,24,20,12,36]},

    {name:'Recurring',rows:recr,widths:[10,24,12,24,16,12,12,8,8]},
    {name:'Companies',rows:comr,widths:[28,24,24,12]},
    {name:'Settings',rows:setr,widths:[20,40]}]));
  stamp();toast('Excel file downloaded');
}

/* ---------------- import ---------------- */
function dateOf(v){
  if(typeof v==='string'){const m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;const u=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(u){let y=+u[3];if(y<100)y+=2000;return `${y}-${pad(u[1])}-${pad(u[2])}`}}
  else if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*86400000));return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`}
  return null;
}
/* Reads your spreadsheet by its column headings, not fixed column letters, so older and newer layouts both import. */
const nn=x=>String(x??'').toLowerCase().replace(/\s+/g,' ').trim();
function tplLookup(){
  const m=new Map();
  const alias={'mortgage':'mortgage','other house purchases':'otherhouse','hangout fund':'hangout','tithing':'tithing','house insurance':'houseins','e-fund':'efund','computer build':'computer','gun build':'gun','3d printing':'3dp','car replacement':'carrepl','home improvement':'homeimp','traditional ira':'tradira','tracfone':'tracfone','cellular':'tracfone','water/elec':'water','water':'water','electric':'water','gas':'gas','natural gas':'gas','other house':'otherhouse','spotify':'spotify','subscription':'spotify','subscriptions':'spotify','hangout':'hangout','computer':'computer','gun':'gun','car replace':'carrepl','3d':'3dp','trad ira':'tradira','tip to israel':'tip','israel trip':'tip','vacation':'tip','home improve':'homeimp'};
  for(const k in alias)if(cat(alias[k]))m.set(k,alias[k]);
  for(const c of state.cats)m.set(nn(c.name),c.id);
  return h=>{const k=nn(h);if(!k)return null;if(m.has(k))return m.get(k);
    if(k.length>=4)for(const c of state.cats){const n=nn(c.name);if(n.startsWith(k)||(n.length>=4&&k.startsWith(n)))return c.id}
    return null};
}
function parseTemplate(sheets,year){
  const tx=[],unknown={},find=tplLookup();let skipped=0;
  const isNum=v=>typeof v==='number'&&isFinite(v);
  const add=(date,type,cid,amt,memo)=>tx.push({id:uid(),date,type,cat:cid,amt:r2(amt),memo});
  const colIdx=ref=>{let n=0;for(const ch of ref.replace(/\d+/g,''))n=n*26+ch.charCodeAt(0)-64;return n-1};
  MONTHS.forEach((mn,i)=>{
    const ws=sheets[mn];if(!ws)return;const first=`${year}-${pad(i+1)}-01`,pre=first.slice(0,7);
    const maxC=Math.max(45,...Object.keys(ws).map(colIdx).map(x=>x+1));
    const row=(r,f)=>{for(let c=0;c<maxC;c++){const v=ws[colName(c)+r];if(v!==undefined)f(colName(c),v,c)}};
    /* top-left block: Date? Memo, Gained, Budgeted */
    const h1={};row(1,(L,v)=>{const k=nn(v);(h1[k]=h1[k]||[]).push(L)});
    const memoC=(h1['memo']||['B'])[0],gainC=(h1['gained']||['C'])[0],dateC=(h1['date']||[])[0]||(memoC==='B'?'A':null);
    const memoOf=r=>nn(ws[memoC+r]);
    let titheAt=5;for(let r=2;r<=12;r++)if(memoOf(r)==='tithing'){titheAt=r;break}
    for(let r=2;r<Math.min(titheAt,13);r++){const v=ws[gainC+r];if(isNum(v)&&v>0){const d=dateC?dateOf(ws[dateC+r]):null;add(d&&d.slice(0,7)===pre?d:first,'income',null,v,String(ws[memoC+r]||'Paycheck'))}}
    for(let r=2;r<=12;r++){const v=ws[gainC+r];if(memoOf(r)==='tithing'&&isNum(v)&&v!==0&&cat('tithing'))add(first,'expense','tithing',-v,'Tithing')}
    /* expense and savings columns, found by their row-2 headings */
    const cols=[];let dateCol=null,firstCol=null;
    row(2,(L,v,c)=>{
      if(typeof v!=='string')return;
      const id=find(v);
      if(id&&cat(id)&&cat(id).kind){if(firstCol===null||c<firstCol)firstCol=c;cols.push([L,id,c])}
    });
    row(2,(L,v,c)=>{if(typeof v==='string'&&firstCol!==null&&c>firstCol&&nn(v)==='date'&&dateCol===null&&!cols.some(x=>x[0]===L))dateCol=L});
    const known=new Set(cols.map(x=>x[0]));
    for(let r=3;r<=80;r++){
      const rd=dateCol?dateOf(ws[dateCol+r]):null,rdate=rd&&rd.slice(0,7)===pre?rd:first;
      for(const [L,id] of cols){const v=ws[L+r];if(!isNum(v)||v===0)continue;
        if(cat(id).kind==='bucket')add(rdate,'save',id,v,'');else add(rdate,'expense',id,-v,'')}
    }
    row(2,(L,v,c)=>{if(typeof v!=='string'||firstCol===null||c<=firstCol||known.has(L)||L===dateCol)return;
      let n=0;for(let r=3;r<=80;r++){const x=ws[L+r];if(isNum(x)&&x!==0)n++}
      if(n){unknown[v]=(unknown[v]||0)+n;skipped+=n}});
  });
  /* budgets: the Budgeted column next to each category name on the first month */
  const budgets={};
  const jan=sheets['January']||sheets[MONTHS.find(m=>sheets[m])];
  if(jan){
    const h1={};for(let c=0;c<12;c++){const v=jan[colName(c)+'1'];if(v!==undefined)h1[nn(v)]=h1[nn(v)]||colName(c)}
    const memoC=h1['memo']||'B',gainC=h1['gained']||'C',budC=h1['budgeted']||'D';
    for(let r=7;r<=60;r++){const id=find(jan[memoC+r]);const c=id&&cat(id);if(!c||c.kind!=='expense'||id==='tithing')continue;
      const d=jan[budC+r],g=jan[gainC+r]??0;if(isNum(d)&&isNum(g)){const b=r2(d-g);if(b>=0)budgets[id]=b}}
  }
  /* starting balances and which account holds each bucket, from the "Total Saved" sheet */
  const starts={},accts={};let leftover=null,yr=null;
  const ts=sheets['Total Saved'];
  if(ts){
    for(let c=1;c<30;c++){const L=colName(c),h=ts[L+'2'];if(typeof h!=='string')continue;
      const id=find(h),b=id&&cat(id);
      if(b&&b.kind==='bucket'&&isNum(ts[L+'1']))starts[id]=ts[L+'1'];
      if(nn(h).startsWith('total left')&&isNum(ts[L+'1']))leftover=ts[L+'1'];}
    if(leftover===null&&isNum(ts['V1']))leftover=ts['V1'];
    for(let r=2;r<=60;r++){const id=find(ts['Q'+r]),b=id&&cat(id),a=ts['S'+r];
      if(b&&b.kind==='bucket'&&typeof a==='string'&&a.trim())accts[id]=a.trim()}
    for(let r=3;r<=80&&yr===null;r++){const d=dateOf(ts['A'+r]);if(d)yr=+d.slice(0,4)}
  }
  return {tx,budgets,starts,accts,leftover,skipped,unknown,detectedYear:yr};
}
function parseOwn(sheets){
  const rows=n=>toRows(sheets[n]||{}).slice(1);
  const st={},snap=defaults();
  for(const [k,v] of rows('Settings'))st[k]=v;
  const s={v:1,settings:{currency:st.currency||'USD',expectedIncome:num(st.expectedIncome),leftoverStart:num(st.leftoverStart),leftoverAccount:st.leftoverAccount||'Checking',actual:{}},
    accounts:(st.accounts?String(st.accounts).split('|'):snap.accounts),groups:[],cats:[],tx:[],rules:[],learn:{},meta:{changes:0,lastBackup:null}};
  const gid={};const G=(name,kind)=>{const key=kind+':'+name;if(!gid[key]){gid[key]=uid();s.groups.push({id:gid[key],name,kind})}return gid[key]};
  for(const r of rows('Categories')){if(!r[0])continue;const kind=r[1]==='bucket'?'bucket':'expense';
    const c={id:uid(),name:String(r[0]),kind,group:G(String(r[2]||'Other'),kind),budget:num(r[3]),ov:{}};
    if(kind==='expense')c.fixed=r[4]==='yes';else{c.account=r[5]||s.accounts[0];c.start=num(r[6])}
    if(num(r[8])>0)c.pct=num(r[8]);
    if(kind==='expense'&&(r[9]==='both'||r[9]==='surplus')){c.roll=r[9];c.rollFrom=r[10]?String(r[10]):nowKey}
    if(kind==='bucket'&&num(r[11])>0){c.goal=num(r[11]);if(r[12])c.goalBy=String(r[12])}
    if(r[7]==='yes')c.archived=true;s.cats.push(c)}
  for(const r of rows('Transactions')){
    const date=dateOf(r[0]);if(!date||!TYPE_LABEL[r[1]])continue;
    const kind=kindOfType(r[1]);const c=kind?s.cats.find(c=>c.name===r[2]&&c.kind===kind):null;if(kind&&!c)continue;
    s.tx.push({id:uid(),date,type:r[1],cat:c?c.id:null,amt:num(r[4]),memo:r[5]===''?'':String(r[5])});
  }
  for(const r of rows('Recurring')){
    const type=r[0];if(!['income','expense','save'].includes(type)||!FREQ[r[4]])continue;
    const kind=kindOfType(type);const c=kind?s.cats.find(c=>c.name===r[1]&&c.kind===kind):null;if(kind&&!c)continue;
    const next=dateOf(r[5]);if(!next)continue;
    s.rules.push({id:uid(),type,cat:c?c.id:null,amt:num(r[2]),memo:r[3]===''?'':String(r[3]),freq:r[4],next,day:+next.slice(8),day2:num(r[6])||15,auto:r[7]==='yes',active:r[8]==='yes'});
  }
  for(const r of rows('Companies')){
    const k=normMemo(r[0]);if(k.length<3)continue;
    const c=r[2]===''?null:s.cats.find(c=>c.name===r[2]&&c.kind==='expense');
    if(!c&&r[3]!=='yes')continue;
    s.learn[k]={cat:c?c.id:'',name:r[1]===''?'':String(r[1]),skip:r[3]==='yes'};
  }
  return s;
}
function parseGeneric(cells){
  const rows=toRows(cells||{});if(rows.length<2)return null;
  const h=rows[0].map(x=>String(x).toLowerCase().trim());
  const ix=(...names)=>h.findIndex(x=>names.some(n=>x.includes(n)));
  const di=ix('date'),ai=ix('amount'),mi=ix('memo','description','payee','note','name'),ci=ix('category'),ti=ix('type');
  if(di<0||ai<0)return null;
  const tx=[],newCats=new Set();
  for(const r of rows.slice(1)){
    const date=dateOf(r[di]);let amt=typeof r[ai]==='number'?r[ai]:parseAmt(r[ai]);if(!date||isNaN(amt)||amt===0)continue;
    let type=ti>=0?String(r[ti]).toLowerCase():'';
    type=Object.keys(TYPE_LABEL).find(t=>type===t||type===TYPE_LABEL[t].toLowerCase())||(amt<0?'expense':'income');
    if(type==='expense'&&ti<0)amt=Math.abs(amt);else if(type==='income')amt=Math.abs(amt);
    const nm=ci>=0?String(r[ci]).trim():'';let cid=null;
    if(kindOfType(type)){const kind=kindOfType(type);const c=state.cats.find(c=>c.kind===kind&&c.name.toLowerCase()===nm.toLowerCase());
      if(c)cid=c.id;else if(kind==='expense'&&type==='expense'){cid='NEW:'+(nm||'Uncategorized');newCats.add(nm||'Uncategorized')}else continue}
    tx.push({id:uid(),date,type,cat:cid,amt:r2(amt),memo:mi>=0?String(r[mi]):''});
  }
  return {tx,newCats:[...newCats]};
}
/* several files at once: they open one after another, each with its own preview */
let IMPQ=[],IMPN=0,IMPTOT=0;
function startImports(fs){IMPQ=fs.slice();IMPTOT=fs.length;IMPN=0;nextImport()}
async function nextImport(){
  const f=IMPQ.shift();if(!f)return;IMPN++;
  await importFile(f);
  if(IMPTOT>1&&dlg.open)dlg.insertAdjacentHTML('afterbegin',`<p class="note" style="margin:0 0 6px">File ${IMPN} of ${IMPTOT}: <b>${esc(f.name)}</b></p>`);
}
async function importFile(file){
  try{
    const name=file.name.toLowerCase();
    if(name.endsWith('.json')){
      const o=JSON.parse(await file.text());
      if(!o||!Array.isArray(o.cats)||!Array.isArray(o.tx)||!Array.isArray(o.groups))throw new Error('This JSON file is not a Budget Moth backup.');
      const nrc=o.receipts?Object.keys(o.receipts).length:0;
      return openDlg(`<h2>Restore backup</h2><p>This replaces everything in the app with the backup: ${o.tx.length} entries and ${o.cats.length} categories${nrc?`, plus ${nrc} receipt photo${nrc>1?'s':''}`:''}.</p><div class="actions"><button class="btn ghost" data-d="cancel">Cancel</button><button class="btn" data-d="go">Replace and restore</button></div>`,
        {cancel:closeDlg,go(){
          const rcs=o.receipts;delete o.receipts;replaceState(o);commit();closeDlg();render();
          toast('Backup restored',()=>{undo();render()});
          if(rcs)(async()=>{for(const id in rcs){try{await rcPut(id,new Blob([fromB64(rcs[id].d)],{type:rcs[id].t||'image/jpeg'}))}catch(e){}}render()})();
        }});
    }
    let sheets;
    if(name.endsWith('.csv'))sheets=parseCSV(await file.text());
    else{const buf=await file.arrayBuffer();const z=await readZip(buf);sheets=z['content.xml']?parseODS(z['content.xml']):z['xl/workbook.xml']?parseXLSX(z):null;if(!sheets)throw new Error('Could not find any sheets in this file.')}
    const rowsOf=Object.fromEntries(Object.entries(sheets).map(([k,v])=>[k,v]));
    if(sheets.Transactions&&sheets.Categories){
      const s=parseOwn(rowsOf);
      return openDlg(`<h2>Restore from Excel export</h2><p>Found ${s.tx.length} entries and ${s.cats.length} categories. This replaces everything in the app.</p><div class="actions"><button class="btn ghost" data-d="cancel">Cancel</button><button class="btn" data-d="go">Replace and restore</button></div>`,
        {cancel:closeDlg,go(){replaceState(s);commit();closeDlg();render();toast('Restored from Excel')}});
    }
    if(MONTHS.some(m=>sheets[m])){
      const guess=parseTemplate(sheets,new Date().getFullYear());
      const fnY=(String(file.name).match(/(?:^|\D)(20\d{2}|19\d{2})(?:\D|$)/)||[])[1],shY=guess.detectedYear;
      const yr=+fnY||shY||new Date().getFullYear();
      const ynote=fnY&&shY&&+fnY!==shY?`<p class="note"><b>Check the year:</b> the file name says ${fnY} but the sheet's dates say ${shY}. Using ${fnY}.</p>`:(fnY?`<p class="note">Year taken from the file name.</p>`:shY?`<p class="note">Year taken from the sheet's dates.</p>`:`<p class="note"><b>Couldn't tell the year from this file.</b> Set it above before importing.</p>`);
      const run=(year)=>parseTemplate(sheets,year);
      let r=run(yr);
      const body=(r)=>`<p>Found <b>${r.tx.length}</b> entries across ${MONTHS.filter(m=>sheets[m]).length} month sheets${r.skipped?` (${r.skipped} numbers skipped)`:''}.
        ${Object.keys(r.budgets).length?`Budgets for ${Object.keys(r.budgets).length} categories and `:''}${Object.keys(r.starts).length?`starting balances `:''}will be read too.</p>
        ${Object.keys(r.unknown).length?`<p class="note"><b>Skipped columns with numbers:</b> ${Object.entries(r.unknown).map(([k,n])=>esc(k)+' ('+n+')').join(', ')}. Add or rename a matching category first if you want them.</p>`:''}
        ${ynote}<p class="note">Your spreadsheet has no dates on entries, so each one is dated the 1st of its month. You can edit dates afterwards in the Ledger.</p>`;
      return openDlg(`<h2>Import spreadsheet</h2><form><label class="f" for="i-y">Year of this spreadsheet</label><input id="i-y" name="y" type="number" value="${yr}" style="max-width:140px"><div id="i-body" style="margin-top:12px">${body(r)}</div>
        <label class="row" style="margin-top:10px"><input type="checkbox" name="rep" checked> <span>Replace existing entries for that year</span></label>
        <label class="row" style="margin-top:6px"><input type="checkbox" name="bud" checked> <span>Use the budgets and starting balances from the file</span></label>
        <div class="actions"><button type="button" class="btn ghost" data-d="cancel">Cancel</button><button class="btn" type="submit">Import ${r.tx.length} entries</button></div></form>`,{
        cancel:closeDlg,
        change(el){if(el.name==='y'){const yy=+el.value;if(yy>1999&&yy<2200){r=run(yy);$('#i-body').innerHTML=body(r)}}},
        submit(fd){
          const year=String(+fd.get('y'));const r2_=run(+year);
          if(fd.get('rep'))state.tx=state.tx.filter(t=>t.date.slice(0,4)!==year);
          state.tx.push(...r2_.tx);

const FREQ={monthly:'Monthly',semimonthly:'Twice a month',biweekly:'Every 2 weeks',weekly:'Weekly'};
const parseD=s=>new Date(s+'T12:00');
const fmtD=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dim=(y,m)=>new Date(y,m+1,0).getDate();
function advance(r,s){
  const d=parseD(s);
  if(r.freq==='weekly'){d.setDate(d.getDate()+7);return fmtD(d)}
  if(r.freq==='biweekly'){d.setDate(d.getDate()+14);return fmtD(d)}
  const y=d.getFullYear(),m=d.getMonth();
  if(r.freq==='semimonthly'){
    const a=Math.min(r.day,r.day2),b=Math.max(r.day,r.day2);
    if(d.getDate()<b)return fmtD(new Date(y,m,Math.min(b,dim(y,m)),12));
    return fmtD(new Date(y,m+1,Math.min(a,dim(y,m+1)),12));
  }
  return fmtD(new Date(y,m+1,Math.min(r.day,dim(y,m+1)),12));
}
function ruleName(r){return r.type==='income'?(r.memo||'Income'):catName(r.cat)}
function dueItems(){
  const t=todayStr(),out=[];

    if(!r.active)continue;let n=r.next,c=0;
    if(r.type!=='income'&&!cat(r.cat))continue;
    while(n&&n<=t&&c<36){out.push({r,date:n});n=advance(r,n);c++}
  }
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function settleRules(items){ // move each rule's next date past the last occurrence handled
  const last=new Map();for(const i of items)last.set(i.r,i.date);

}

const normMemo=s=>String(s||'').toLowerCase().replace(/[^\p{L}\s]+/gu,' ').split(/\s+/).filter(w=>w.length>1).join(' ');

/* best saved company for a bank description: exact text first, then the longest saved name it contains */
function findMerchant(memo){
  const k=normMemo(memo);if(k.length<3)return null;
  let best=null,bl=0;
  for(const raw in state.learn){
    const nk=normMemo(raw);if(nk.length<3)continue;
    if(nk===k){best=raw;break}
    if((nk.length>=4&&hasWords(k,nk)||k.length>=4&&hasWords(nk,k))&&nk.length>bl){best=raw;bl=nk.length}
  }
  return best!==null?{key:best,p:merProf(state.learn[best])}:null;
}

/* ================= automatic sync (encrypted GitHub gist, or a linked file) ================= */
/* Every entry carries a change time, and deletions leave a marker, so two devices always merge
   cleanly: nothing is ever "pick a version". Settings use the newest edit. */
const SYNC={fsa:'showSaveFilePicker' in window&&'showOpenFilePicker' in window,provider:'off',h:null,gist:null,st:'off',err:'',last:0,t:null,busy:false,again:false,etag:null,cached:null,salt:null,started:0};
const FTYPES=[{description:'Budget Moth data',accept:{'application/json':['.json']}}];
const GFILE='budget-ledger.json',GDESC='Budget Moth sync data',GKEY='budgetledger.gist',GH='https://api.github.com';
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('budgetledger',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('receipts'))d.createObjectStore('receipts')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){const db=await idbOpen();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbSet(k,v){const db=await idbOpen();return new Promise((res,rej)=>{const tr=db.transaction('kv','readwrite');v===undefined?tr.objectStore('kv').delete(k):tr.objectStore('kv').put(v,k);tr.oncomplete=()=>res();tr.onerror=()=>rej(tr.error)})}

/* ---- merge ---- */
function sigOf(s){
  const ids=s.tx.map(t=>t.id+':'+(t.u||0)).sort().join(',');
  const del=Object.entries(s.deleted||{}).map(([k,v])=>k+':'+v).sort().join(',');
  const pa=(s.meta&&s.meta.partAt)||{};
  return h32(ids)+'|'+h32(del)+'|'+JSON.stringify(partHashes(s))+'|'+['cfg','rules','learn'].map(k=>pa[k]||0).join(',');
}
function mergeStates(a,b){
  const cl=x=>JSON.parse(JSON.stringify(x));
  const ma=a.meta||{},mb=b.meta||{},pa=ma.partAt||{},pb=mb.partAt||{},ha=partHashes(a),hb=partHashes(b);
  const pick=k=>{const x=pa[k]||0,y=pb[k]||0;return (y>x||(y===x&&hb[k]>ha[k]))?b:a};
  const cs=pick('cfg'),other=cs===a?b:a;
  const out={v:1,settings:cl(cs.settings),accounts:cl(cs.accounts),groups:cl(cs.groups),cats:cl(cs.cats),rules:cl(pick('rules').rules||[]),learn:cl(pick('learn').learn||{}),tx:[],deleted:{}};
  for(const k in (b.deleted||{}))out.deleted[k]=b.deleted[k];
  for(const k in (a.deleted||{}))out.deleted[k]=Math.max(out.deleted[k]||0,a.deleted[k]);
  const m=new Map();
  for(const t of b.tx)m.set(t.id,t);
  for(const t of a.tx){const o=m.get(t.id);if(!o||(t.u||0)>=(o.u||0))m.set(t.id,t)}
  for(const [id,t] of m){const d=out.deleted[id];if(d&&d>=(t.u||0))continue;out.tx.push(cl(t))}
  out.tx.sort((x,y)=>(x.u||0)-(y.u||0));
  /* keep any category an entry or rule still points at, even if the other side's settings won */
  const haveC=new Set(out.cats.map(c=>c.id)),haveG=new Set(out.groups.map(g=>g.id));
  const need=new Set([...out.tx.map(t=>t.cat),...out.rules.map(r=>r.cat)].filter(Boolean));
  for(const c of other.cats)if(need.has(c.id)&&!haveC.has(c.id)){out.cats.push(cl(c));haveC.add(c.id)}
  for(const c of out.cats)if(!haveG.has(c.group)){const g=[...a.groups,...b.groups].find(x=>x.id===c.group);if(g){out.groups.push(cl(g));haveG.add(g.id)}}
  const cutoff=Date.now()-400*864e5;for(const id in out.deleted)if(out.deleted[id]<cutoff)delete out.deleted[id];
  out.meta=Object.assign({},ma,{partAt:{cfg:Math.max(pa.cfg||0,pb.cfg||0),rules:Math.max(pa.rules||0,pb.rules||0),learn:Math.max(pa.learn||0,pb.learn||0)}});
  out.meta.partHash=partHashes(out);
  return out;
}

/* ---- encryption for the cloud copy (AES-GCM, key from your passphrase) ---- */
const toB64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const fromB64=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const KEYS=new Map();
function needCrypto(){if(!(window.crypto&&crypto.subtle))throw Object.assign(new Error('Encrypted sync needs a secure page. Open the https:// address (for example your GitHub Pages link), not a plain http one.'),{code:'enc'})}
async function keyFor(pass,saltB64){
  needCrypto();const id=pass.length+':'+h32(pass)+':'+saltB64;if(KEYS.has(id))return KEYS.get(id);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromB64(saltB64),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  KEYS.set(id,k);return k;
}
async function packText(text){
  needCrypto();if(!SYNC.salt)SYNC.salt=toB64(crypto.getRandomValues(new Uint8Array(16)));
  const key=await keyFor(SYNC.gist.pass,SYNC.salt),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text)));
  return JSON.stringify({enc:'budget-ledger-v1',salt:SYNC.salt,iv:toB64(iv),ct:toB64(ct)});
}
async function unpackText(text){
  const o=JSON.parse(text);
  if(o.enc!=='budget-ledger-v1'){if(Array.isArray(o.cats))return text;throw new Error('That sync data was not made by Budget Moth.')}
  SYNC.salt=o.salt;const key=await keyFor(SYNC.gist.pass,o.salt);
  try{return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(o.iv)},key,fromB64(o.ct)))}
  catch(e){throw Object.assign(new Error('That passphrase doesn’t match the one used for your synced data.'),{code:'pass'})}
}

/* ---- transports ---- */
async function ghFetch(path,opt={}){
  const g=SYNC.gist;let r;
  try{r=await fetch(GH+path,{cache:'no-store',...opt,headers:{Authorization:'Bearer '+g.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}})}
  catch(e){throw Object.assign(new Error('offline'),{code:'net'})}
  if(r.status===401)throw Object.assign(new Error('GitHub rejected the token. Set up sync again with a new token.'),{code:'auth'});
  if(r.status===429||(r.status===403&&r.headers.get('x-ratelimit-remaining')==='0'))throw Object.assign(new Error('GitHub is limiting requests for a moment. Sync resumes on its own.'),{code:'rate'});
  if(r.status===403)throw Object.assign(new Error('GitHub refused the request. Check that the token has the gist permission.'),{code:'auth'});
  if(r.status===404&&path.startsWith('/gists/'))throw Object.assign(new Error('The sync gist was deleted or can’t be found. Set up sync again.'),{code:'auth'});
  return r;
}
const fileT={
  async read(){const f=await SYNC.h.getFile(),t=await f.text();return {text:t.trim()?t:null}},
  async write(text){const w=await SYNC.h.createWritable();await w.write(text);await w.close()},
  pack:async t=>t,unpack:async t=>t
};
const gistT={
  async read(){
    const r=await ghFetch('/gists/'+SYNC.gist.id,{headers:SYNC.etag?{'If-None-Match':SYNC.etag}:{}});
    if(r.status===304)return {text:SYNC.cached};
    if(!r.ok)throw new Error('GitHub returned '+r.status+'.');
    const j=await r.json(),f=j.files&&j.files[GFILE];if(!f)return {text:null};
    let text=f.content;
    if(f.truncated){const rr=await fetch(f.raw_url,{cache:'no-store',headers:{Authorization:'Bearer '+SYNC.gist.token}});text=await rr.text()}
    SYNC.etag=r.headers.get('ETag');SYNC.cached=text;
    return {text:text&&text.trim()?text:null};
  },
  async write(text){
    const r=await ghFetch('/gists/'+SYNC.gist.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({files:{[GFILE]:{content:text}}})});
    if(!r.ok)throw new Error('GitHub returned '+r.status+' when saving.');
    SYNC.etag=r.headers.get('ETag');SYNC.cached=text;
  },
  pack:packText,unpack:unpackText
};

/* ---- the sync loop ---- */
const safeToRender=()=>!dlg.open&&!(document.activeElement&&/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName));
let pendingRender=false;
function syncSchedule(){
  if(SYNC.provider==='off'||(SYNC.provider==='file'&&SYNC.st==='needperm'))return;
  clearTimeout(SYNC.t);SYNC.t=setTimeout(syncCycle,700);
}
function syncSoon(){if(Date.now()-SYNC.started>4000)syncCycle()}
function syncFail(e){
  const c=e&&e.code;
  if(c==='net'){SYNC.st='offline';SYNC.err='No connection. Changes are saved here and will sync when you’re back online.'}
  else if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))SYNC.st='needperm';
  else if(c==='auth'){SYNC.st='auth';SYNC.err=e.message}
  else if(c==='pass'){SYNC.st='pass';SYNC.err=e.message}
  else{SYNC.st='error';SYNC.err=String((e&&e.message)||e)}
}
async function syncCycle(){
  if(SYNC.provider==='off')return;
  if(SYNC.provider==='file'&&SYNC.st==='needperm')return;
  if(SYNC.busy){SYNC.again=true;return}
  if(dlg.open){clearTimeout(SYNC.t);SYNC.t=setTimeout(syncCycle,2500);return}
  SYNC.busy=true;SYNC.started=Date.now();clearTimeout(SYNC.t);SYNC.t=null;
  const was=SYNC.st;if(was!=='ok'){SYNC.st='busy';pillUpdate(false)}
  let changed=false;
  try{
    const T=SYNC.provider==='gist'?gistT:fileT;
    const r=await T.read();
    let remote=null;
    if(r.text){
      remote=fixState(JSON.parse(await T.unpack(r.text)));
      if(!Array.isArray(remote.cats)||!Array.isArray(remote.tx))throw new Error('That sync data was not made by Budget Moth.');
    }
    if(remote){
      const merged=mergeStates(state,remote);
      if(sigOf(merged)!==sigOf(state)){state=merged;SNAP=snapOf(state);prevReset();cache=null;persist();changed=true}
    }
    if(!remote||sigOf(state)!==sigOf(remote))await T.write(await T.pack(JSON.stringify(state)));
    SYNC.st='ok';SYNC.err='';SYNC.last=Date.now();
  }catch(e){syncFail(e)}
  finally{
    SYNC.busy=false;
    if(changed)afterRemote();else pillUpdate(was!==SYNC.st);
    if(SYNC.again){SYNC.again=false;SYNC.t=setTimeout(syncCycle,300)}
  }
}
function afterRemote(){if(safeToRender())checkDue();else pendingRender=true}
function flushRender(){if(pendingRender&&safeToRender()){pendingRender=false;checkDue()}}
function syncTime(){return SYNC.last?new Date(SYNC.last).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):''}
function syncPill(){
  if(SYNC.provider==='off')return '<span id="syncpill"></span>';
  const st=SYNC.st,warn=['needperm','auth','pass','error'].includes(st);
  const label={ok:'Synced '+syncTime(),busy:'Syncing…',offline:'Offline',needperm:'Reconnect sync',auth:'Sync needs attention',pass:'Sync needs attention',error:'Sync problem',off:''}[st]||'';
  const act=st==='needperm'?'syncperm':warn?'syncfix':'syncnow';
  return `<button id="syncpill" class="syncbtn ${warn?'warn':''}" data-act="${act}" title="${esc(SYNC.err||'Tap to sync now')}">${esc(label)}</button>`;
}
function pillUpdate(full){
  const el=document.getElementById('syncpill');
  if(full&&safeToRender()){render();return}
  if(el)el.outerHTML=syncPill();
}
function syncStatusText(){
  return ({ok:`Up to date${syncTime()?' as of '+syncTime():''}.`,busy:'Syncing…',offline:'Offline. Changes are saved here and sync automatically when you’re back online.',needperm:'Paused until you allow access again.',auth:SYNC.err,pass:SYNC.err,error:'Problem: '+SYNC.err})[SYNC.st]||'';
}
async function syncNow(){await syncCycle();if(SYNC.st==='ok')toast('Up to date')}
async function syncUnlink(){
  SYNC.provider='off';SYNC.h=null;SYNC.gist=null;SYNC.st='off';SYNC.etag=null;SYNC.cached=null;SYNC.salt=null;
  try{localStorage.removeItem(GKEY)}catch(e){}
  try{await idbSet('sync',undefined)}catch(e){}
  render();toast('Sync turned off. Your data stays on this device.');
}
async function syncInit(){
  try{
    const g=JSON.parse(localStorage.getItem(GKEY)||'null');
    if(g&&g.token&&g.id&&g.pass){SYNC.gist=g;SYNC.provider='gist';SYNC.st='busy';render();await syncCycle();return}
  }catch(e){}
  if(!SYNC.fsa)return;
  try{
    const h=await idbGet('sync');if(!h)return;
    SYNC.h=h;SYNC.provider='file';
    const p=await h.queryPermission({mode:'readwrite'});
    if(p==='granted'){SYNC.st='busy';render();await syncCycle()}else{SYNC.st='needperm';render()}
  }catch(e){SYNC.provider='off';SYNC.h=null}
}

async function gistConnect(token,pass){
  const prev={provider:SYNC.provider,gist:SYNC.gist,salt:SYNC.salt,etag:SYNC.etag,cached:SYNC.cached};
  SYNC.gist={token,pass,id:null};SYNC.salt=null;SYNC.etag=null;SYNC.cached=null;
  try{
    let found=null;
    for(let page=1;page<=5&&!found;page++){
      const r=await ghFetch(`/gists?per_page=100&page=${page}`);
      if(!r.ok)throw new Error('GitHub returned '+r.status+'.');
      const list=await r.json();
      found=list.find(x=>x.description===GDESC&&x.files&&x.files[GFILE]);
      if(list.length<100)break;
    }
    if(found){
      SYNC.gist.id=found.id;
      const r=await gistT.read();                        /* proves the passphrase before anything is saved */
      if(r.text)await gistT.unpack(r.text);
    }else{
      const body=await packText(JSON.stringify(state));
      const r=await ghFetch('/gists',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({description:GDESC,public:false,files:{[GFILE]:{content:body}}})});
      if(!r.ok)throw new Error('GitHub couldn’t create the sync gist ('+r.status+'). Check that the token has the gist permission.');
      SYNC.gist.id=(await r.json()).id;SYNC.etag=null;SYNC.cached=null;
    }
  }catch(e){Object.assign(SYNC,prev);throw e}
  try{localStorage.setItem(GKEY,JSON.stringify(SYNC.gist))}catch(e){}
  SYNC.provider='gist';SYNC.h=null;SYNC.st='busy';
  try{await idbSet('sync',undefined)}catch(e){}
}
