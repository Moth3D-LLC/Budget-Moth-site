function openBankImport(rows){
  const hdr=rows[0].map(x=>String(x??'').trim());
  const data=rows.slice(1).filter(r=>r.some(v=>v!==''));
  if(!data.length)throw new Error('That file has no rows to import.');
  const find=(...n)=>hdr.findIndex(h=>n.some(x=>h.toLowerCase().includes(x)));
  const col={date:find('date','posted'),desc:find('description','payee','merchant','memo','name','details'),amt:find('amount'),debit:find('debit','withdrawal','paid out'),credit:find('credit','deposit','paid in'),cat:find('category')};
  if(col.debit===col.amt)col.debit=-1;
  if(col.credit===col.amt)col.credit=-1;
  const nums=col.amt>=0?data.map(r=>typeof r[col.amt]==='number'?r[col.amt]:parseAmt(r[col.amt])).filter(v=>!isNaN(v)):[];
  const allPos=nums.length>0&&nums.every(v=>v>=0);
  const opt=sel=>`<option value="-1">(none)</option>`+hdr.map((h,i)=>`<option value="${i}" ${i===sel?'selected':''}>${esc(h||'Column '+colName(i))}</option>`).join('');
  const field=(n,l,sel)=>`<div><label class="f" for="b-${n}">${l}</label><select id="b-${n}" name="${n}">${opt(sel)}</select></div>`;
  openDlg(`<h2>Import bank file</h2><p class="note" style="margin-top:0">${data.length} rows found. Check which column is which.</p>
   <form><div class="grid2">${field('date','Date',col.date)}${field('desc','Description',col.desc)}${field('amt','Amount',col.amt)}${field('cat','Category (optional)',col.cat)}${field('debit','Money out column',col.debit)}${field('credit','Money in column',col.credit)}</div>
   <p class="note">Use Amount, or the Money out and in columns if your bank splits them.</p>
   <label class="f" for="b-sign" style="margin-top:8px">In the Amount column…</label><select id="b-sign" name="sign"><option value="neg" ${allPos?'':'selected'}>Spending is negative</option><option value="pos" ${allPos?'selected':''}>Spending is positive</option></select>
   <div class="actions"><button type="button" class="btn ghost" data-d="cancel">Cancel</button><button class="btn" type="submit">Next</button></div></form>`,{
    cancel:closeDlg,
    submit(fd){
      const cfg={date:+fd.get('date'),desc:+fd.get('desc'),amt:+fd.get('amt'),debit:+fd.get('debit'),credit:+fd.get('credit'),cat:+fd.get('cat'),sign:fd.get('sign')};
      if(cfg.date<0)return toast('Choose the date column');
      if(cfg.amt<0&&cfg.debit<0&&cfg.credit<0)return toast('Choose the amount column');
      bankReview(data,cfg);
    }});
}
function bankReview(data,cfg){
  const cn=v=>typeof v==='number'?v:parseAmt(v);
  const items=[];let bad=0;
  for(const r of data){
    const date=dateOf(r[cfg.date]);if(!date){bad++;continue}
    let spend;
    if(cfg.debit>=0||cfg.credit>=0){
      const d=cfg.debit>=0?Math.abs(cn(r[cfg.debit])||0):0,c=cfg.credit>=0?Math.abs(cn(r[cfg.credit])||0):0;spend=d-c;
    }else{const a=cn(r[cfg.amt]);if(isNaN(a)){bad++;continue}spend=cfg.sign==='neg'?-a:a}
    spend=r2(spend);if(!spend){bad++;continue}
    items.push({date,memo:cfg.desc>=0?String(r[cfg.desc]??'').trim():'',type:spend>0?'expense':'income',amt:Math.abs(spend),csvCat:cfg.cat>=0?String(r[cfg.cat]??'').trim():''});
  }
  if(!items.length){openDlg(`<h2>Nothing to import</h2><p>No rows had a readable date and amount. Go back and check the columns.</p><div class="actions"><button class="btn" data-d="cancel">OK</button></div>`,{cancel:closeDlg});return}
  const have={};for(const t of state.tx){const k=`${t.date}|${t.type}|${t.amt}`;have[k]=(have[k]||0)+1}
  for(const i of items){const k=`${i.date}|${i.type}|${i.amt}`;if(have[k]>0){i.dup=true;have[k]--}}
  const groups=new Map();
  items.filter(i=>i.type==='expense').forEach(i=>{const k=normMemo(i.memo)||'(no description)';let g=groups.get(k);if(!g){g={key:k,sample:i.memo||'(no description)',rows:[],total:0,csvCat:i.csvCat};groups.set(k,g)}g.rows.push(i);g.total+=i.amt});
  const gl=[...groups.values()];
  for(const g of gl){
    const mm=findMerchant(g.sample);g.mkey=mm?mm.key:null;g.name=(mm&&mm.p.name)||'';g.skip=!!(mm&&mm.p.skip);
    g.sug=guessCat(g.sample);
    if(!g.sug&&g.csvCat){const c=state.cats.find(c=>c.kind==='expense'&&!c.archived&&c.name.toLowerCase()===g.csvCat.toLowerCase());if(c)g.sug=c.id}
  }
  gl.sort((a,b)=>((a.sug||a.skip)?1:0)-((b.sug||b.skip)?1:0)||b.total-a.total);
  const matched=gl.filter(g=>g.sug||g.skip).length;
  const inc=items.filter(i=>i.type==='income'),dups=items.filter(i=>i.dup).length;
  const incTotal=r2(inc.reduce((a,i)=>a+i.amt,0));
  openDlg(`<h2>Match spending to categories</h2>
   <p class="note" style="margin-top:0">${items.length} rows read${bad?` (${bad} skipped: no readable date or amount)`:''}. ${matched} of ${gl.length} merchants matched from what you've entered before. Pick a category for the rest. Names and categories you set here are remembered as company profiles.</p>
   <form>${gl.map((g,n)=>`<div class="cat" style="grid-template-columns:1fr 1fr">
     <div style="grid-column:1/-1">${esc(g.sample)} <span class="mute" style="font-size:.84rem">· ${g.rows.length}× · ${fmt(g.total)}</span></div>
     <input type="text" name="n${n}" value="${esc(g.name)}" placeholder="Show as (optional)" aria-label="Display name for ${esc(g.sample)}">
     <select name="g${n}" aria-label="Category for ${esc(g.sample)}">${catOptions('expense',g.sug).replace('Choose a category…',"Don't import")}</select>
     <label class="row" style="grid-column:1/-1;gap:8px;font-size:.88rem;color:var(--mute)"><input type="checkbox" name="s${n}" ${g.skip?'checked':''}> Always skip this company</label></div>`).join('')||'<p class="empty">No spending rows.</p>'}
   ${inc.length?`<label class="row" style="margin-top:12px"><input type="checkbox" name="inc" checked> <span>Import ${inc.length} deposit${inc.length>1?'s':''} (${fmt(incTotal)}) as income</span></label>`:''}
   ${dups?`<label class="row" style="margin-top:8px"><input type="checkbox" name="dups"> <span>Also import ${dups} row${dups>1?'s':''} that look already entered (same date and amount)</span></label>`:''}
   <label class="row" style="margin-top:8px"><input type="checkbox" name="learn" checked> <span>Remember these companies for next time</span></label>
   <p class="note" style="margin:2px 0 0 28px">Tip: type the plain company name (like Corner Market) so every location matches.</p>
   <div class="actions"><button type="button" class="btn ghost" data-d="cancel">Cancel</button><button class="btn" type="submit">Import</button></div></form>`,{
    cancel:closeDlg,
    submit(fd){
      const withDups=!!fd.get('dups');let n=0;
      gl.forEach((g,k)=>{
        const cid=fd.get('g'+k),nm=(fd.get('n'+k)||'').trim(),skip=!!fd.get('s'+k);
        /* update the company this row already matched; otherwise save under the typed name (so every location matches), else the full bank text */
        const nn=normMemo(nm);let key=g.mkey!==null?g.mkey:(nn.length>=3&&hasWords(g.key,nn)?nn:g.key);
        if(fd.get('learn')&&normMemo(key).length>=3&&g.key!=='(no description)'){
          const old=merProf(state.learn[key]);
          if(skip)state.learn[key]=Object.assign({},old,{skip:true,name:nm||old.name||''});
          else if(cid||nm)state.learn[key]={cat:cid||old.cat||'',name:nm,skip:false};
        }
        if(skip||!cid)return;
        for(const i of g.rows){if(i.dup&&!withDups)continue;state.tx.push({id:uid(),date:i.date,type:'expense',cat:cid,amt:i.amt,memo:nm||i.memo});n++}
      });
      if(fd.get('inc'))for(const i of inc){if(i.dup&&!withDups)continue;state.tx.push({id:uid(),date:i.date,type:'income',cat:null,amt:i.amt,memo:i.memo||'Deposit'});n++}
      if(n)commit();closeDlg();ui.tab='ledger';ui.led.m='all';render();toast(`Imported ${n} entr${n===1?'y':'ies'}`);
    }});
}

function syncSection(){
  let body;
  if(SYNC.provider==='gist')body=`<p class="note" style="margin:0 0 10px"><b>Cloud sync is on.</b> Changes save and merge by themselves, with your data encrypted in a private GitHub gist. ${esc(syncStatusText())}</p><div class="row"><button class="btn" data-act="syncnow">Sync now</button><button class="btn alt" data-act="gistsetup">Change token or passphrase</button><button class="btn ghost" data-act="syncunlink">Stop syncing</button></div>`;
  else if(SYNC.provider==='file')body=`<p class="note" style="margin:0 0 10px"><b>Syncing automatically</b> with <b>${esc(SYNC.h.name)}</b>. ${esc(syncStatusText())}</p><div class="row">${SYNC.st==='needperm'?`<button class="btn" data-act="syncperm">Reconnect</button>`:`<button class="btn" data-act="syncnow">Sync now</button>`}<button class="btn ghost" data-act="syncunlink">Stop syncing</button></div>`;
  else body=`<p class="note" style="margin:0 0 10px">Your data is always saved on this device as you type. Turn on sync to keep your phone and computer matching without lifting a finger. Changes from each device merge on their own, so you never have to choose a version.</p>
    <div class="row"><button class="btn" data-act="gistsetup">Set up cloud sync…</button>${SYNC.fsa?`<button class="btn alt" data-act="synclink">Use a sync file…</button>`:''}</div>
    <p class="note">Cloud sync works on every device and needs a free GitHub account. A sync file works in Chrome and Edge on a computer.</p>`;
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[new File(['{}'],'a.json',{type:'application/json'})]}));
  return `<section class="sheet"><h2>Sync between devices</h2>${body}${canShare?`<div class="row" style="margin-top:10px"><button class="btn alt" data-act="share">Share backup…</button></div>`:''}</section>`;
}
function merchantsSection(){
  const ks=Object.keys(state.learn).filter(k=>{const p=merProf(state.learn[k]);return p.skip||cat(p.cat)}).sort();
  const row=k=>{const p=merProf(state.learn[k]);const title=p.name||k;
    return `<li data-mrow="${esc((title+' '+k).toLowerCase())}"><button class="entry" style="grid-template-columns:1fr auto" data-act="company" data-id="${esc(k)}"><span class="m">${esc(title)}<small>${p.name?esc(k)+' · ':''}bank text</small></span><span class="${p.skip?'mute':''}" style="font-size:.9rem;text-align:right">${p.skip?'Skipped':esc(catName(p.cat))}</span></button></li>`};
  return `<details class="sheet"><summary>Companies (${ks.length})</summary>
   <p class="note" style="margin:0 0 8px">Save a clean name and default budget for each company. Bank imports and the Add form use these automatically. They're also learned from your entries.</p>
   ${ks.length>8?`<input id="mer-q" type="search" placeholder="Search companies" aria-label="Search companies" style="margin-bottom:8px">`:''}
   ${ks.length?`<ul class="entries">${ks.slice(0,300).map(row).join('')}</ul>`:`<p class="empty">No companies yet. Import a bank file or add one.</p>`}
   <div style="margin-top:12px"><button class="btn sm alt" data-act="company">Add company</button></div></details>`;
}

/* ---------------- events ---------------- */
/* tap or hover a chart point to read its value */
const chartRead=e=>{const p=e.target.closest&&e.target.closest('svg.chart [data-t]');if(!p)return;const r=p.closest('section');const o=r&&r.querySelector('.chart-read');if(o)o.textContent=p.dataset.t};
app.addEventListener('pointerover',chartRead);
app.addEventListener('click',chartRead);
addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey)||e.altKey)return;const k=e.key.toLowerCase();if(k!=='z'&&k!=='y')return;
  const t=document.activeElement;if(dlg.open||(t&&/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)))return;
  e.preventDefault();const redoIt=k==='y'||e.shiftKey,x=redoIt?redo():undo();
  if(x){render();toast((redoIt?'Redid: ':'Undid: ')+x.label,()=>{redoIt?undo():redo();render()},redoIt?'Undo':'Redo')}
});
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case'tab':ui.tab=b.dataset.v;render();window.scrollTo(0,0);break;
    case'dtype':{const t=b.dataset.v;ui.draft.type=t;if(t!=='expense')ui.draft.splits=null;const k=kindOfType(t);if(!k||(cat(ui.draft.cat)||{}).kind!==k)ui.draft.cat='';ui.err='';render();break}
    case'pickcat':ui.draft.cat=ui.draft.cat===id?'':id;ui.autoCat=false;render();break;
    case'mnav':ui.month=addMonths(ui.month,+b.dataset.n);ui.led.limit=150;render();break;
    case'mnow':ui.month=nowKey;render();break;
    case'ynav':ui.month=addMonths(ui.month,12*b.dataset.n);render();break;
    case'edit':openEdit(id);break;
    case'ovr':openOverride(id);break;
    case'split':{const total=parseAmt(ui.draft.amt);
      if(isNaN(total)||total<=0){ui.err='Enter the total amount first, then split it.';render();break}
      openSplit(total,ui.draft.splits||(ui.draft.cat?[{cat:ui.draft.cat,amt:total}]:null),(parts,single)=>{ui.draft.splits=parts;if(parts)ui.draft.cat='';else if(single)ui.draft.cat=single;ui.err='';render()});break}
    case'unsplit':ui.draft.splits=null;render();break;
    case'goal':openGoal(id);break;
    case'goalset':{const c=cat(id),g=goalInfo(c,ui.month,cumTo(ui.month).bal[id]||0);
      if(c&&g&&g.need){c.budget=g.need;c.pct&&delete c.pct;if(c.ov)delete c.ov[ui.month];commit();render();toast(`${c.name} target set to ${fmt(g.need)} a month`)}break}
    case'plan':openPlan();break;
    case'more':ui.led.limit+=150;render();break;
    case'backup':exportJSON();break;
    case'bklater':PREFS.snooze=Date.now()+864e5;savePrefs();render();break;
    case'brk':ui.brk=b.dataset.v;render();break;
    case'trend':{const ks=M3.map((_,i)=>`${ui.month.slice(0,4)}-${pad(i+1)}`),av=trendAvail(ks);let sel=trendSel(ks,av);
      sel=sel.includes(id)?sel.filter(x=>x!==id):[...sel,id].slice(-6);ui.trend=sel;render();break}
    case'rcdraftx':ui.rcDraft=null;render();break;
    case'undo':{const e=undo();if(e){render();toast('Undid: '+e.label,()=>{redo();render()},'Redo')}break}
    case'redo':{const e=redo();if(e){render();toast('Redid: '+e.label,()=>{undo();render()})}break}
    case'undoto':{const n=+b.dataset.n;let c=0;for(let i=0;i<n;i++)if(undo())c++;if(c){render();toast(c===1?'Undid 1 change':`Undid ${c} changes`,()=>{for(let i=0;i<c;i++)redo();render()},'Redo')}break}
    case'rule':openRule(id);break;
    case'rulesbills':rulesFromBills();break;
    case'due':openDue();break;
    case'synclink':openSyncLink();break;
    case'syncperm':syncReconnect();break;
    case'syncnow':syncNow();break;
    case'gistsetup':openGistSetup();break;
    case'syncfix':SYNC.provider==='gist'?openGistSetup():syncNow();break;
    case'syncunlink':syncUnlink();break;
    case'share':shareBackup();break;
    case'company':openCompany(id);break;
    case'forget':delete state.learn[id];commit();render();break;
    case'install':if(deferredInstall){deferredInstall.prompt();deferredInstall=null;render()}break;
    case'xlsx':exportXLSX();break;
    case'csv':exportCSV();break;
    case'addcat':promptName('New category','Name',n=>{const g=group(id);state.cats.push(g.kind==='bucket'?{id:uid(),name:n,kind:'bucket',group:id,budget:0,account:state.accounts[0],start:0,ov:{}}:{id:uid(),name:n,kind:'expense',group:id,budget:0,fixed:false,ov:{}});commit();render()});break;
    case'addgrp':promptName('New group','Group name',n=>{state.groups.push({id:uid(),name:n,kind:b.dataset.kind});commit();render()});break;
    case'delgrp':state.groups=state.groups.filter(g=>g.id!==id);commit();render();break;
    case'addacct':promptName('New account','Account name',n=>{state.accounts.push(n);commit();render()});break;
    case'delcat':{const c=cat(id);
      if(c.archived){c.archived=false;commit();render();break}
      if(state.tx.some(t=>t.cat===id)){c.archived=true;commit();render();toast(`${c.name} is hidden from new entries. Past entries are kept.`)}
      else{state.cats=state.cats.filter(x=>x.id!==id);commit();render()}
      break}
    case'clear':openDlg(`<h2>Delete all entries?</h2><p>This removes all ${state.tx.length} entries. Your categories and budgets stay. Download a backup first if you might want them back.</p><div class="actions"><button class="btn ghost" data-d="cancel">Cancel</button><button class="btn danger" data-d="go">Delete entries</button></div>`,{cancel:closeDlg,go(){state.tx=[];commit();closeDlg();render();toast('All entries deleted',()=>{undo();render()})}});break;
    case'reset':openDlg(`<h2>Reset everything?</h2><p>This deletes all entries, and puts categories, budgets and settings back to the template defaults.</p><div class="actions"><button class="btn ghost" data-d="cancel">Cancel</button><button class="btn danger" data-d="go">Reset everything</button></div>`,{cancel:closeDlg,go(){replaceState(defaults());commit();closeDlg();render();toast('Reset to defaults',()=>{undo();render()})}});break;
  }
});
app.addEventListener('submit',e=>{if(e.target.id==='addf'){e.preventDefault();submitAdd()}});
app.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='mer-q'){const q=el.value.toLowerCase().trim();document.querySelectorAll('[data-mrow]').forEach(r=>{r.style.display=r.dataset.mrow.includes(q)?'':'none'});return}
  if(el.dataset.draft){ui.draft[el.dataset.draft]=el.value;
    if(el.dataset.draft==='memo'&&ui.draft.type==='expense'&&(!ui.draft.cat||ui.autoCat)){const g=guessCat(el.value);if(g&&g!==ui.draft.cat){ui.draft.cat=g;ui.autoCat=true;const sel=$('#d-cat');if(sel)sel.value=g;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.id===g)))}}if(el.dataset.draft!=='amt'&&ui.err){ui.err='';const p=$('#d-err');if(p)p.textContent=''}}
  else if(el.dataset.led==='q'){ui.led.q=el.value;ui.led.limit=150;const pos=el.selectionStart;render();const n=$('#lf-q');if(n){n.focus();n.setSelectionRange(pos,pos)}}
});
app.addEventListener('change',e=>{
  const el=e.target,d=el.dataset;
  if(d.draft==='cat'){ui.draft.cat=el.value;render();return}
  if(d.rc==='draft'){const f=el.files[0];el.value='';if(f)shrinkPhoto(f).then(b=>{ui.rcDraft=b;render()}).catch(x=>toast(x&&x.message||'Could not read that picture.'));return}
  if(el.id==='bk-days'){PREFS.backupDays=+el.value;savePrefs();render();return}
  if(d.led&&d.led!=='q'){ui.led[d.led]=el.value;ui.led.limit=150;render();return}
  if(d.actual!==undefined){const v=el.value.trim();const a=state.settings.actual=state.settings.actual||{};if(v===''||isNaN(parseAmt(v)))delete a[d.actual];else a[d.actual]=r2(parseAmt(v));commit();render();return}
  if(el.id==='theme'){const v=el.value;if(v)document.documentElement.dataset.theme=v;else delete document.documentElement.dataset.theme;try{localStorage.setItem(KEY+'.theme',v)}catch(x){}return}
  if(el.id==='imp'){const fs=[...el.files];if(fs.length){toast('Reading '+(fs.length>1?fs.length+' files':fs[0].name)+'…');startImports(fs);setTimeout(()=>{el.value=''},0)}return}
  if(d.s){
    if(d.s==='set'){const f=d.f;state.settings[f]=(f==='currency')?(el.value.trim().toUpperCase()||'USD'):(f==='leftoverAccount')?el.value:r2(num(el.value))}
    else if(d.s==='grp'){const g=group(d.id);g.name=el.value.trim()||g.name}
    else if(d.s==='acct'){const old=d.old,nv=el.value.trim();if(!nv||state.accounts.includes(nv)){el.value=old;return}
      state.accounts[+d.i]=nv;el.dataset.old=nv;state.cats.forEach(c=>{if(c.account===old)c.account=nv});if(state.settings.leftoverAccount===old)state.settings.leftoverAccount=nv;
      if(state.settings.actual&&old in state.settings.actual){state.settings.actual[nv]=state.settings.actual[old];delete state.settings.actual[old]}}
    else if(d.s==='cat'){const c=cat(d.id),f=d.f;
      if(f==='budget'||f==='start')c[f]=r2(num(el.value));else if(f==='fixed')c.fixed=el.checked;
      else if(f==='pct'){const v=Math.max(0,Math.min(100,num(el.value)));if(v>0)c.pct=v;else delete c.pct}
      else if(f==='roll'){if(el.value){c.roll=el.value;if(!c.rollFrom)c.rollFrom=nowKey}else delete c.roll}
      else if(f==='rollFrom')c.rollFrom=el.value||nowKey;
      else if(f==='name')c.name=el.value.trim()||c.name;else c[f]=el.value}
    commit();
    if(d.f==='group'||d.f==='leftoverAccount'||d.s==='acct'||d.f==='pct'||d.f==='roll')render();
  }
});
addEventListener('error',e=>{try{toast('Something went wrong: '+(e.message||'unknown error'))}catch(x){}});addEventListener('unhandledrejection',e=>{try{toast('Something went wrong: '+((e.reason&&e.reason.message)||e.reason||'unknown error'))}catch(x){}});
try{const th=localStorage.getItem(KEY+'.theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
try{localStorage.setItem(KEY+'.t','1');localStorage.removeItem(KEY+'.t')}catch(e){storageOK=false}

syncInit();checkDue();
Promise.all([histLoad(),rcLoad()]).then(()=>rcPurge()).then(()=>{if(safeToRender())render()});

addEventListener('pagehide',()=>{if(SYNC.t){clearTimeout(SYNC.t);syncCycle()}});

dlg.addEventListener('close',()=>{flushRender();if(IMPQ.length)setTimeout(nextImport,150)});app.addEventListener('focusout',()=>setTimeout(flushRender,60));
if('serviceWorker' in navigator&&hosted())navigator.serviceWorker.register('sw.js').catch(()=>{});
